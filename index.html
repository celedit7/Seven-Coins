<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Seven Coins</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .message {
      display: none;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: #111;
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #eee;
      color: #111;
    }

    .danger {
      background: #c62828;
    }

    .text-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 10px;
      color: #555;
      cursor: pointer;
    }

    .welcome {
      font-size: 15px;
      color: #666;
      margin-bottom: 18px;
    }

    .balance-card {
      background: #111;
      color: #fff;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
    }

    .balance-label {
      font-size: 13px;
      opacity: .7;
    }

    .balance {
      font-size: 38px;
      font-weight: 800;
      margin-top: 7px;
    }

    .section-title {
      font-size: 20px;
      margin: 25px 0 12px;
    }

    .menu {
      display: grid;
      gap: 10px;
    }

    .menu button {
      width: 100%;
      text-align: left;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
    }

    .menu-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .menu-description {
      color: #777;
      font-size: 13px;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      border-top: 1px solid #ddd;
      margin-top: 28px;
      padding-top: 12px;
    }

    .bottom-nav button {
      border: 0;
      background: transparent;
      padding: 9px 2px;
      cursor: pointer;
      font-size: 12px;
    }

    .profile-card {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .profile-card strong {
      display: block;
      margin-bottom: 6px;
    }

    .profile-card p {
      color: #777;
      font-size: 14px;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 40px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">🪙 Seven Coins</div>

  <!-- LOGIN -->
  <section id="loginScreen" class="screen active">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your Seven Coins account.
    </p>

    <div id="loginMessage" class="message"></div>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="btn">
      Login
    </button>

    <button id="showSignupBtn" class="text-btn">
      Don't have an account? Create Account
    </button>

  </section>


  <!-- CREATE ACCOUNT -->
  <section id="signupScreen" class="screen">

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your Seven Coins account.
    </p>

    <div id="signupMessage" class="message"></div>

    <input
      id="signupUsername"
      type="text"
      placeholder="Username"
      maxlength="30"
      autocomplete="username"
    >

    <input
      id="signupEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <input
      id="signupConfirm"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button id="signupBtn" class="btn">
      Create Account
    </button>

    <button id="showLoginBtn" class="text-btn">
      Already have an account? Login
    </button>

  </section>


  <!-- LOADING -->
  <section id="loadingScreen" class="screen">

    <div class="loading">
      Connecting to Seven Coins...
    </div>

  </section>


  <!-- HOME -->
  <section id="homeScreen" class="screen">

    <div class="welcome">
      Welcome, <strong id="homeUsername">User</strong> 👋
    </div>

    <div class="balance-card">

      <div class="balance-label">
        Your Balance
      </div>

      <div class="balance">
        0 🪙
      </div>

    </div>


    <h2 class="section-title">
      Daily Tasks
    </h2>

    <div class="menu">

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-tasks.html')">
        <div class="menu-title">🎯 Daily Tasks</div>
        <div class="menu-description">
          Complete available tasks.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-poll.html')">
        <div class="menu-title">📊 Daily Poll</div>
        <div class="menu-description">
          Vote in today's poll.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/referral.html')">
        <div class="menu-title">👥 Referral</div>
        <div class="menu-description">
          Invite friends and learn about referrals.
        </div>
      </button>

    </div>


    <h2 class="section-title">
      Account
    </h2>

    <div class="menu">

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/transactions-history.html')">
        <div class="menu-title">💰 Transactions</div>
        <div class="menu-description">
          View transaction history.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/withdraw.html')">
        <div class="menu-title">💸 Withdrawal</div>
        <div class="menu-description">
          Withdrawals are currently unavailable.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/advertisement.html')">
        <div class="menu-title">📢 Advertise</div>
        <div class="menu-description">
          Promote your product.
        </div>
      </button>

    </div>


    <div class="bottom-nav">

      <button onclick="showHome()">
        🏠<br>Home
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-tasks.html')">
        🎯<br>Tasks
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/referral.html')">
        👥<br>Referral
      </button>

      <button onclick="showProfile()">
        👤<br>Profile
      </button>

    </div>

  </section>


  <!-- PROFILE -->
  <section id="profileScreen" class="screen">

    <h1>Profile</h1>

    <p class="subtitle">
      Your Seven Coins account.
    </p>

    <div class="profile-card">
      <strong>Username</strong>
      <p id="profileUsername">—</p>
    </div>

    <div class="profile-card">
      <strong>Email</strong>
      <p id="profileEmail">—</p>
    </div>

    <div class="profile-card">
      <strong>Account ID</strong>
      <p id="profileUid">—</p>
    </div>

    <button class="btn secondary" onclick="showHome()">
      ← Back Home
    </button>

    <button class="btn danger" onclick="logout()">
      Logout
    </button>

  </section>

</div>


<!-- Firebase -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* ================================
     YOUR FIREBASE CONFIG
  ================================= */

  const firebaseConfig = {

    apiKey: "AIzaSyBKVtAuouv5c29zhtRwiesyVizPaaVnB8M",

    authDomain: "seven-coins-b841d.firebaseapp.com",

    projectId: "seven-coins-b841d",

    storageBucket: "seven-coins-b841d.firebasestorage.app",

    messagingSenderId: "457210030247",

    appId: "1:457210030247:web:830d1402d137d178245382"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  /* ================================
     SCREEN CONTROL
  ================================= */

  function showScreen(id) {

    document
      .querySelectorAll(".screen")
      .forEach(screen => {
        screen.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

  }


  window.showHome = function() {

    showScreen("homeScreen");

  };


  window.showProfile = function() {

    const user = auth.currentUser;

    if (!user) return;

    document.getElementById("profileUsername").textContent =
      user.displayName || "No username";

    document.getElementById("profileEmail").textContent =
      user.email || "No email";

    document.getElementById("profileUid").textContent =
      user.uid;

    showScreen("profileScreen");

  };


  /* ================================
     OPEN BLOGGER PAGE
  ================================= */

  window.openPage = function(url) {

    window.location.href = url;

  };


  /* ================================
     LOGIN
  ================================= */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");

      message.classList.remove("show");


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        message.classList.add("show");

        return;

      }


      const button =
        document.getElementById("loginBtn");

      button.disabled = true;

      button.textContent = "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        message.textContent =
          getFirebaseError(error);

        message.classList.add("show");

      }


      button.disabled = false;

      button.textContent = "Login";

    });


  /* ================================
     CREATE ACCOUNT
  ================================= */

  document
    .getElementById("signupBtn")
    .addEventListener("click", async () => {

      const username =
        document.getElementById("signupUsername").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirm =
        document.getElementById("signupConfirm").value;

      const message =
        document.getElementById("signupMessage");

      message.classList.remove("show");


      if (!username) {

        message.textContent =
          "Please enter a username.";

        message.classList.add("show");

        return;

      }


      if (!email) {

        message.textContent =
          "Please enter your email.";

        message.classList.add("show");

        return;

      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.classList.add("show");

        return;

      }


      if (password !== confirm) {

        message.textContent =
          "Passwords do not match.";

        message.classList.add("show");

        return;

      }


      const button =
        document.getElementById("signupBtn");

      button.disabled = true;

      button.textContent =
        "Creating account...";


      try {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          result.user,
          {
            displayName: username
          }
        );


      } catch (error) {

        console.error(error);

        message.textContent =
          getFirebaseError(error);

        message.classList.add("show");

      }


      button.disabled = false;

      button.textContent =
        "Create Account";

    });


  /* ================================
     LOGOUT
  ================================= */

  window.logout = async function() {

    try {

      await signOut(auth);

    } catch (error) {

      console.error(error);

      alert("Logout failed. Please try again.");

    }

  };


  /* ================================
     AUTH STATE
  ================================= */

  onAuthStateChanged(auth, user => {

    if (user) {

      document
        .getElementById("homeUsername")
        .textContent =
          user.displayName || "User";

      document
        .getElementById("profileUsername")
        .textContent =
          user.displayName || "No username";

      document
        .getElementById("profileEmail")
        .textContent =
          user.email || "No email";

      document
        .getElementById("profileUid")
        .textContent =
          user.uid;

      showScreen("homeScreen");

    } else {

      showScreen("loginScreen");

    }

  });


  /* ================================
     SWITCH LOGIN / SIGNUP
  ================================= */

  document
    .getElementById("showSignupBtn")
    .addEventListener("click", () => {

      document
        .getElementById("loginMessage")
        .classList.remove("show");

      showScreen("signupScreen");

    });


  document
    .getElementById("showLoginBtn")
    .addEventListener("click", () => {

      document
        .getElementById("signupMessage")
        .classList.remove("show");

      showScreen("loginScreen");

    });


  /* ================================
     FIREBASE ERROR MESSAGES
  ================================= */

  function getFirebaseError(error) {

    switch (error.code) {

      case "auth/invalid-email":
        return "Please enter a valid email address.";

      case "auth/email-already-in-use":
        return "This email is already registered.";

      case "auth/weak-password":
        return "Password must be at least 6 characters.";

      case "auth/invalid-credential":
        return "Incorrect email or password.";

      case "auth/user-not-found":
        return "No account found with this email.";

      case "auth/wrong-password":
        return "Incorrect email or password.";

      case "auth/network-request-failed":
        return "Network error. Check your internet connection.";

      case "auth/too-many-requests":
        return "Too many attempts. Please try again later.";

      default:
        return error.message ||
          "Something went wrong. Please try again.";

    }

  }

</script>

</body>
</html>
