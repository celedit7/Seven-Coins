<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultimate Pool</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:#090d14;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:700px;
  padding:14px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.stats{
  display:flex;
  gap:8px;
}

.stat{
  background:#1a2230;
  border-radius:12px;
  padding:8px 11px;
  font-size:13px;
}

.table-wrap{
  width:100%;
  display:flex;
  justify-content:center;
}

.table{
  position:relative;
  width:min(94vw,620px);
  aspect-ratio:1.8/1;
  background:#173f2c;
  border:22px solid #633d20;
  border-radius:18px;
  box-shadow:
    inset 0 0 25px rgba(0,0,0,.55),
    0 15px 40px rgba(0,0,0,.5);
  overflow:visible;
}

/* Inner rail */

.table::before{
  content:"";
  position:absolute;
  inset:-12px;
  border:5px solid #9a6332;
  border-radius:13px;
  pointer-events:none;
}

/* pockets */

.pocket{
  position:absolute;
  width:7%;
  aspect-ratio:1;
  background:#050505;
  border-radius:50%;
  z-index:4;
  box-shadow:inset 0 0 7px #000;
}

.p1{left:-4%;top:-4%}
.p2{left:46.5%;top:-4%}
.p3{right:-4%;top:-4%}
.p4{left:-4%;bottom:-4%}
.p5{left:46.5%;bottom:-4%}
.p6{right:-4%;bottom:-4%}

/* balls */

.ball{
  position:absolute;
  width:4.2%;
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  box-shadow:
    inset -4px -4px 6px rgba(0,0,0,.45),
    inset 3px 3px 5px rgba(255,255,255,.35),
    0 2px 4px rgba(0,0,0,.5);
  transition:opacity .15s;
}

.ball::after{
  content:"";
  position:absolute;
  width:32%;
  height:32%;
  background:white;
  border-radius:50%;
  left:34%;
  top:34%;
}

.ball.solid::after{
  display:none;
}

.white{
  background:#f5f5f5;
}

.yellow{background:#f5c400}
.blue{background:#166ee8}
.red{background:#e52c31}
.purple{background:#7d36bd}
.orange{background:#ef791d}
.green{background:#159447}
.maroon{background:#831e25}
.black{background:#111}

.ball.stripe{
  background:
    linear-gradient(
      white 28%,
      white 36%,
      var(--ball) 36%,
      var(--ball) 64%,
      white 64%,
      white 72%
    );
}

.ball.stripe.yellow{--ball:#f5c400}
.ball.stripe.blue{--ball:#166ee8}
.ball.stripe.red{--ball:#e52c31}
.ball.stripe.purple{--ball:#7d36bd}
.ball.stripe.orange{--ball:#ef791d}
.ball.stripe.green{--ball:#159447}
.ball.stripe.maroon{--ball:#831e25}

.aim-line{
  position:absolute;
  height:2px;
  background:rgba(255,255,255,.65);
  transform-origin:left center;
  z-index:6;
  pointer-events:none;
  display:none;
}

.power-area{
  margin-top:18px;
}

.power-label{
  display:flex;
  justify-content:space-between;
  color:#aeb7c7;
  font-size:12px;
  margin-bottom:6px;
}

.power{
  width:100%;
  height:15px;
  appearance:none;
  background:#202a39;
  border-radius:20px;
  outline:none;
}

.power::-webkit-slider-thumb{
  appearance:none;
  width:25px;
  height:25px;
  border-radius:50%;
  background:white;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-top:12px;
}

button{
  border:0;
  padding:13px 8px;
  border-radius:12px;
  background:#202a39;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.shoot{
  background:#fff;
  color:#111;
}

.message{
  text-align:center;
  color:#8792a5;
  font-size:12px;
  margin-top:12px;
  min-height:18px;
}

/* popup */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:50;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:340px;
  background:#18202d;
  border-radius:22px;
  padding:26px;
  text-align:center;
}

.popup .emoji{
  font-size:55px;
}

.popup h2{
  margin:8px 0;
}

.popup p{
  color:#aeb7c7;
  line-height:1.5;
  font-size:14px;
}

.popup button{
  width:100%;
  margin-top:12px;
  background:white;
  color:#111;
}

@media(max-width:430px){
  .table{
    border-width:15px;
  }

  .ball{
    width:5%;
  }
}
</style>
</head>

<body>

<div class="game">

<header>
  <div class="logo">🎱 Ultimate Pool</div>

  <div class="stats">
    <div class="stat">
      🎯 <span id="score">0</span>
    </div>

    <div class="stat">
      Shots <span id="shots">0</span>
    </div>
  </div>
</header>

<div class="table-wrap">

  <div class="table" id="table">

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>

    <div class="aim-line" id="aimLine"></div>

  </div>

</div>

<div class="power-area">

  <div class="power-label">
    <span>SHOT POWER</span>
    <span id="powerText">50%</span>
  </div>

  <input
    id="power"
    class="power"
    type="range"
    min="10"
    max="100"
    value="50"
  >

</div>

<div class="buttons">

  <button onclick="resetGame()">
    🔄 Reset
  </button>

  <button onclick="changeAim()">
    🎯 Aim
  </button>

  <button class="shoot" onclick="shoot()">
    🏏 Shoot
  </button>

</div>

<div class="message" id="message">
  Drag across the table to aim, then press Shoot.
</div>

</div>


<div class="overlay" id="winPopup">

  <div class="popup">

    <div class="emoji">🏆</div>

    <h2>You Win!</h2>

    <p id="winMessage">
      Great game!
    </p>

    <button onclick="resetGame()">
      Play Again
    </button>

  </div>

</div>


<script>

/* =========================================
   GAME SETTINGS
========================================= */

const table =
  document.getElementById("table");

const aimLine =
  document.getElementById("aimLine");

const power =
  document.getElementById("power");

const powerText =
  document.getElementById("powerText");

const message =
  document.getElementById("message");

let balls = [];

let aiming = false;

let aimAngle = Math.PI;

let score = 0;

let shots = 0;

let moving = false;

let audio;


/* =========================================
   SOUND
========================================= */

function sound(type){

  try{

    if(!audio)
      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    if(type === "hit")
      oscillator.frequency.value = 130;

    if(type === "pocket")
      oscillator.frequency.value = 520;

    if(type === "win")
      oscillator.frequency.value = 700;

    gain.gain.value = .05;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + .08
    );

  }catch(e){}

}


/* =========================================
   BALL DATA
========================================= */

const ballData = [

  {
    number:0,
    color:"white",
    solid:true,
    x:27,
    y:50
  },

  {
    number:1,
    color:"yellow",
    solid:true,
    x:72,
    y:45
  },

  {
    number:2,
    color:"blue",
    solid:true,
    x:76,
    y:50
  },

  {
    number:3,
    color:"red",
    solid:true,
    x:72,
    y:55
  },

  {
    number:4,
    color:"purple",
    solid:true,
    x:80,
    y:42
  },

  {
    number:5,
    color:"orange",
    solid:true,
    x:80,
    y:58
  },

  {
    number:6,
    color:"green",
    solid:true,
    x:84,
    y:46
  },

  {
    number:7,
    color:"maroon",
    solid:true,
    x:84,
    y:54
  },

  {
    number:8,
    color:"black",
    solid:true,
    x:88,
    y:50
  },

  {
    number:9,
    color:"yellow",
    solid:false,
    x:80,
    y:50
  }

];


/* =========================================
   CREATE BALL
========================================= */

function createBall(data){

  const el =
    document.createElement("div");

  el.className =
    "ball " +
    data.color +
    (data.solid ? " solid" : " stripe");

  el.style.left =
    data.x + "%";

  el.style.top =
    data.y + "%";

  el.dataset.number =
    data.number;

  table.appendChild(el);

  return {
    ...data,
    element:el,
    vx:0,
    vy:0,
    active:true
  };

}


/* =========================================
   RESET
========================================= */

function resetGame(){

  table
    .querySelectorAll(".ball")
    .forEach(
      b => b.remove()
    );

  balls = [];

  ballData.forEach(
    data =>
      balls.push(
        createBall(data)
      )
  );

  score = 0;

  shots = 0;

  moving = false;

  aimAngle = Math.PI;

  updateUI();

  hideWin();

  message.textContent =
    "Aim the cue ball and press Shoot.";

}


/* =========================================
   UI
========================================= */

function updateUI(){

  document.getElementById(
    "score"
  ).textContent = score;

  document.getElementById(
    "shots"
  ).textContent = shots;

}


/* =========================================
   POWER
========================================= */

power.addEventListener(
  "input",
  () => {

    powerText.textContent =
      power.value + "%";

  }
);


/* =========================================
   AIM
========================================= */

function changeAim(){

  if(moving)
    return;

  aimAngle += Math.PI / 12;

  if(
    aimAngle > Math.PI * 2
  ){

    aimAngle -= Math.PI * 2;

  }

  drawAim();

}


function drawAim(){

  const cue =
    balls.find(
      b => b.number === 0
    );

  if(!cue || !cue.active)
    return;

  const rect =
    table.getBoundingClientRect();

  const x =
    cue.x / 100 * rect.width;

  const y =
    cue.y / 100 * rect.height;

  const length = 28;

  aimLine.style.left =
    x + "px";

  aimLine.style.top =
    y + "px";

  aimLine.style.width =
    length + "%";

  aimLine.style.transform =
    `rotate(${aimAngle}rad)`;

  aimLine.style.display =
    "block";

}


/* =========================================
   TOUCH AIM
========================================= */

table.addEventListener(
  "pointerdown",
  e => {

    if(moving)
      return;

    aiming = true;

    updatePointerAim(e);

  }
);


table.addEventListener(
  "pointermove",
  e => {

    if(!aiming)
      return;

    updatePointerAim(e);

  }
);


window.addEventListener(
  "pointerup",
  () => {

    aiming = false;

  }
);


function updatePointerAim(e){

  const cue =
    balls.find(
      b => b.number === 0
    );

  if(!cue)
    return;

  const rect =
    table.getBoundingClientRect();

  const pointerX =
    e.clientX - rect.left;

  const pointerY =
    e.clientY - rect.top;

  const cueX =
    cue.x / 100 * rect.width;

  const cueY =
    cue.y / 100 * rect.height;

  aimAngle =
    Math.atan2(
      pointerY - cueY,
      pointerX - cueX
    );

  drawAim();

}


/* =========================================
   SHOOT
========================================= */

function shoot(){

  if(moving)
    return;

  const cue =
    balls.find(
      b => b.number === 0
    );

  if(!cue || !cue.active)
    return;

  const strength =
    Number(power.value) / 100;

  const speed =
    0.9 + strength * 1.8;

  cue.vx =
    Math.cos(aimAngle) * speed;

  cue.vy =
    Math.sin(aimAngle) * speed;

  moving = true;

  shots++;

  updateUI();

  aimLine.style.display =
    "none";

  message.textContent =
    "Balls are moving...";

  sound("hit");

  requestAnimationFrame(
    physics
  );

}


/* =========================================
   PHYSICS
========================================= */

function physics(){

  if(!moving)
    return;

  let activeMotion = false;

  const rect =
    table.getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;


  balls.forEach(
    ball => {

      if(!ball.active)
        return;


      ball.x +=
        ball.vx / width * 100;

      ball.y +=
        ball.vy / height * 100;


      /*
        Friction
      */

      ball.vx *= .982;

      ball.vy *= .982;


      /*
        Wall collision
      */

      const radius =
        2.1;


      if(
        ball.x <= radius
      ){

        ball.x = radius;

        ball.vx =
          Math.abs(ball.vx);

        sound("hit");

      }


      if(
        ball.x >= 100 - radius
      ){

        ball.x =
          100 - radius;

        ball.vx =
          -Math.abs(ball.vx);

        sound("hit");

      }


      if(
        ball.y <= radius
      ){

        ball.y = radius;

        ball.vy =
          Math.abs(ball.vy);

        sound("hit");

      }


      if(
        ball.y >= 100 - radius
      ){

        ball.y =
          100 - radius;

        ball.vy =
          -Math.abs(ball.vy);

        sound("hit");

      }


      /*
        Pocket detection
      */

      const pockets = [

        [0,0],
        [50,0],
        [100,0],
        [0,100],
        [50,100],
        [100,100]

      ];


      for(
        const p of pockets
      ){

        const dx =
          ball.x - p[0];

        const dy =
          ball.y - p[1];

        const distance =
          Math.sqrt(
            dx*dx + dy*dy
          );


        if(distance < 7){

          pocketBall(ball);

          break;

        }

      }


      if(
        Math.abs(ball.vx) > .01 ||
        Math.abs(ball.vy) > .01
      ){

        activeMotion = true;

      }

    }
  );


  /*
    Ball collisions
  */

  for(
    let i=0;
    i<balls.length;
    i++
  ){

    for(
      let j=i+1;
      j<balls.length;
      j++
    ){

      collide(
        balls[i],
        balls[j]
      );

    }

  }


  /*
    Update visual positions
  */

  balls.forEach(
    ball => {

      if(ball.active){

        ball.element.style.left =
          ball.x + "%";

        ball.element.style.top =
          ball.y + "%";

      }

    }
  );


  if(activeMotion){

    requestAnimationFrame(
      physics
    );

  }else{

    moving = false;

    afterShot();

  }

}


/* =========================================
   COLLISION
========================================= */

function collide(a,b){

  if(
    !a.active ||
    !b.active
  )
    return;


  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  const distance =
    Math.sqrt(
      dx*dx + dy*dy
    );


  const minDistance =
    4.4;


  if(
    distance >= minDistance ||
    distance === 0
  )
    return;


  const nx =
    dx / distance;

  const ny =
    dy / distance;


  const relativeVelocity =
    (b.vx-a.vx)*nx +
    (b.vy-a.vy)*ny;


  if(
    relativeVelocity > 0
  )
    return;


  const impulse =
    -relativeVelocity;


  a.vx -=
    impulse * nx;

  a.vy -=
    impulse * ny;

  b.vx +=
    impulse * nx;

  b.vy +=
    impulse * ny;


  const overlap =
    minDistance - distance;


  a.x -=
    nx * overlap/2;

  a.y -=
    ny * overlap/2;

  b.x +=
    nx * overlap/2;

  b.y +=
    ny * overlap/2;


  sound("hit");

}


/* =========================================
   POCKET
========================================= */

function pocketBall(ball){

  if(!ball.active)
    return;


  ball.active = false;

  ball.vx = 0;

  ball.vy = 0;

  ball.element.style.opacity =
    "0";


  sound("pocket");


  if(
    ball.number === 0
  ){

    /*
      Cue ball returns to
      the break position.
    */

    setTimeout(
      () => {

        ball.x = 27;

        ball.y = 50;

        ball.active = true;

        ball.element.style.opacity =
          "1";

        message.textContent =
          "Scratch! Cue ball returned.";

      },
      700
    );

  }else{

    score += 10;

    updateUI();

  }

}


/* =========================================
   AFTER SHOT
========================================= */

function afterShot(){

  const remaining =
    balls.filter(
      b =>
        b.number !== 0 &&
        b.active
    );


  if(
    remaining.length === 1 &&
    remaining[0].number === 8
  ){

    /*
      If only the 8-ball remains,
      player has nearly cleared table.
    */

    message.textContent =
      "🎱 Only the 8-ball remains!";

  }


  /*
    Win when all object balls
    are pocketed.
  */

  if(
    remaining.length === 0
  ){

    winGame();

    return;

  }


  message.textContent =
    "Your turn. Aim and shoot.";

  drawAim();

}


/* =========================================
   WIN
========================================= */

function winGame(){

  moving = false;

  sound("win");

  document.getElementById(
    "winMessage"
  ).textContent =
    "🏆 Table cleared in " +
    shots +
    " shots! Final score: " +
    score;


  document.getElementById(
    "winPopup"
  ).classList.add(
    "show"
  );

}


function hideWin(){

  document.getElementById(
    "winPopup"
  ).classList.remove(
    "show"
  );

}


/* =========================================
   START
========================================= */

resetGame();

</script>

</body>
</html>
