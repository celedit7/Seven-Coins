<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Celedit Words</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#34495e 0,#101722 45%,#070b11 100%);
  color:white;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:15px;
  min-height:100vh;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.coins{
  background:#202a38;
  padding:9px 13px;
  border-radius:20px;
  font-weight:bold;
}

.levelBox{
  text-align:center;
  margin-bottom:15px;
}

.level{
  font-size:25px;
  font-weight:900;
}

.progress{
  width:100%;
  height:7px;
  background:#202a38;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px;
}

.progressBar{
  height:100%;
  width:0%;
  background:#f1c40f;
  transition:.3s;
}

.words{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin:15px 0 25px;
}

.wordRow{
  display:flex;
  gap:7px;
  min-height:40px;
}

.slot{
  width:35px;
  height:38px;
  border-bottom:3px solid #9ba6b5;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:900;
}

.slot.found{
  color:#f1c40f;
  border-bottom-color:#f1c40f;
}

.answer{
  min-height:45px;
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:20px;
}

.letters{
  width:270px;
  height:270px;
  margin:auto;
  position:relative;
}

.letter{
  position:absolute;
  width:66px;
  height:66px;
  border-radius:50%;
  border:0;
  background:
    linear-gradient(145deg,#ffffff,#cfd6df);
  color:#17202b;
  font-size:24px;
  font-weight:900;
  box-shadow:
    0 7px 14px rgba(0,0,0,.35),
    inset 0 2px 3px rgba(255,255,255,.8);
  cursor:pointer;
  transform:translate(-50%,-50%);
}

.letter:active{
  transform:translate(-50%,-50%) scale(.9);
}

.letter.used{
  opacity:.3;
  pointer-events:none;
}

.centerCircle{
  position:absolute;
  left:50%;
  top:50%;
  width:90px;
  height:90px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.12);
  pointer-events:none;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:20px;
}

.action{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:#202a38;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.action:active{
  transform:scale(.95);
}

.hint{
  background:#e6b800;
  color:#111;
}

.message{
  text-align:center;
  min-height:22px;
  margin-top:13px;
  font-weight:bold;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:14px;
}

.stat{
  background:#151e2a;
  border-radius:12px;
  padding:8px 12px;
  font-size:12px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;
  background:#17202c;
  border-radius:25px;
  padding:28px;
  text-align:center;
}

.popupIcon{
  font-size:55px;
}

.popup h2{
  margin:8px 0;
}

.popup p{
  color:#aeb7c4;
  line-height:1.5;
}

.popup button{
  border:0;
  width:100%;
  padding:13px;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

@media(max-width:380px){
  .letters{
    width:245px;
    height:245px;
  }

  .letter{
    width:60px;
    height:60px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      🍪 Celedit Words
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>

  </div>


  <div class="levelBox">

    <div class="level">
      Level <span id="level">1</span>
    </div>

    <div class="progress">
      <div
        class="progressBar"
        id="progressBar">
      </div>
    </div>

  </div>


  <div
    class="words"
    id="words">
  </div>


  <div
    class="answer"
    id="answer">
  </div>


  <div class="letters">

    <div class="centerCircle"></div>

    <div id="letters"></div>

  </div>


  <div class="buttons">

    <button
      class="action"
      onclick="clearAnswer()">
      ⌫ Clear
    </button>

    <button
      class="action"
      onclick="shuffleLetters()">
      🔀 Shuffle
    </button>

    <button
      class="action hint"
      onclick="useHint()">
      💡 Hint
    </button>

  </div>


  <div
    class="message"
    id="message">
  </div>


  <div class="stats">

    <div class="stat">
      🔥 Streak:
      <span id="streak">0</span>
    </div>

    <div class="stat">
      ⭐ Found:
      <span id="found">0</span>
    </div>

  </div>

</div>


<!-- LEVEL COMPLETE -->

<div
  class="overlay"
  id="levelOverlay">

  <div class="popup">

    <div class="popupIcon">
      🎉
    </div>

    <h2>
      Level Complete!
    </h2>

    <p id="levelReward"></p>

    <button onclick="nextLevel()">
      Continue →
    </button>

  </div>

</div>


<!-- GAME COMPLETE -->

<div
  class="overlay"
  id="gameOverlay">

  <div class="popup">

    <div class="popupIcon">
      🏆
    </div>

    <h2>
      Amazing!
    </h2>

    <p>
      You completed all 20 prototype levels.
    </p>

    <button onclick="restartGame()">
      Play Again
    </button>

  </div>

</div>


<script>

/*
=================================================
 CELEDIT WORDS
 Original word puzzle prototype
=================================================
*/


/* ===============================
   LEVEL DATA
================================ */

const levels = [

  {
    letters:"CAT",
    words:["CAT","ACT","AT"]
  },

  {
    letters:"DOG",
    words:["DOG","GOD","DO"]
  },

  {
    letters:"EARN",
    words:["EARN","NEAR","RAN","EAR"]
  },

  {
    letters:"GAME",
    words:["GAME","MEGA","AGE","GAME"]
  },

  {
    letters:"STAR",
    words:["STAR","ARTS","RATS","ART","RAT"]
  },

  {
    letters:"NOTE",
    words:["NOTE","TONE","ON","NOT","ONE"]
  },

  {
    letters:"COLD",
    words:["COLD","COD","OLD","COL"]
  },

  {
    letters:"FIRE",
    words:["FIRE","RIFE","IRE","FIR"]
  },

  {
    letters:"TIME",
    words:["TIME","MITE","ITEM","TIE"]
  },

  {
    letters:"READ",
    words:["READ","DEAR","DARE","EAR","RED"]
  },

  {
    letters:"BREAD",
    words:["BREAD","BEARD","BARE","BEAR","DEAR"]
  },

  {
    letters:"STONE",
    words:["STONE","NOTES","TONES","NOTE","TONE"]
  },

  {
    letters:"HEART",
    words:["HEART","EARTH","HEAR","HEAT","RATE"]
  },

  {
    letters:"PLANT",
    words:["PLANT","PLANT","PLAN","PANT","TAP"]
  },

  {
    letters:"HOUSE",
    words:["HOUSE","SHOE","HOSE","USE","SHE"]
  },

  {
    letters:"LIGHT",
    words:["LIGHT","HIL T","LIT","HIT","GILT"]
  },

  {
    letters:"WATER",
    words:["WATER","WRITE","RATE","WEAR","TEAR"]
  },

  {
    letters:"MONEY",
    words:["MONEY","MANY","OMEN","YEN"]
  },

  {
    letters:"SMILE",
    words:["SMILE","LIMES","MILES","SLIME","LIME"]
  },

  {
    letters:"WORLD",
    words:["WORLD","WORD","LORD","LOW","OLD"]
  }

];


/*
=================================================
 STATE
=================================================
*/

let currentLevel =
  Number(
    localStorage.getItem(
      "celeditLevel"
    )
  ) || 1;


let coins =
  Number(
    localStorage.getItem(
      "celeditCoins"
    )
  ) || 100;


let streak =
  Number(
    localStorage.getItem(
      "celeditStreak"
    )
  ) || 0;


let foundCount = 0;

let currentAnswer = "";

let currentLetters = [];

let foundWords = [];


/*
=================================================
 ELEMENTS
=================================================
*/

const levelElement =
  document.getElementById("level");

const coinsElement =
  document.getElementById("coins");

const streakElement =
  document.getElementById("streak");

const foundElement =
  document.getElementById("found");

const wordsElement =
  document.getElementById("words");

const answerElement =
  document.getElementById("answer");

const lettersElement =
  document.getElementById("letters");

const messageElement =
  document.getElementById("message");

const progressBar =
  document.getElementById("progressBar");


/*
=================================================
 SAVE
=================================================
*/

function save(){

  localStorage.setItem(
    "celeditLevel",
    currentLevel
  );

  localStorage.setItem(
    "celeditCoins",
    coins
  );

  localStorage.setItem(
    "celeditStreak",
    streak
  );

}


/*
=================================================
 LOAD LEVEL
=================================================
*/

function loadLevel(){

  if(
    currentLevel >
    levels.length
  ){

    currentLevel =
      levels.length;

  }


  const level =
    levels[
      currentLevel-1
    ];


  levelElement.textContent =
    currentLevel;


  coinsElement.textContent =
    coins;


  streakElement.textContent =
    streak;


  foundWords =
    [];


  foundCount =
    0;


  currentAnswer =
    "";


  /*
    Remove accidental duplicate
    words from the level.
  */

  level.words =
    [...new Set(level.words)]
    .filter(
      word =>
        word &&
        !word.includes(" ")
    )
    .map(
      word =>
        word.toUpperCase()
    );


  currentLetters =
    level.letters
      .split("")
      .map(
        (letter,index) => ({
          letter,
          index,
          used:false
        })
      );


  drawWords();

  drawLetters();

  updateAnswer();

  updateProgress();

  messageElement.textContent =
    "";

}


/*
=================================================
 DRAW WORD SLOTS
=================================================
*/

function drawWords(){

  wordsElement.innerHTML =
    "";


  const level =
    levels[
      currentLevel-1
    ];


  const groups =
    {};


  level.words.forEach(
    word => {

      const length =
        word.length;


      if(!groups[length])
        groups[length] = [];


      groups[length].push(
        word
      );

    }
  );


  Object.keys(groups)
    .sort(
      (a,b) =>
        Number(a)-Number(b)
    )
    .forEach(
      length => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "wordRow";


        groups[length]
          .forEach(
            word => {

              /*
                Each word gets its
                own small row container.
              */

              const container =
                document.createElement(
                  "div"
                );

              container.style.display =
                "flex";

              container.style.gap =
                "3px";

              container.style.margin =
                "0 5px";


              for(
                let i=0;
                i<word.length;
                i++
              ){

                const slot =
                  document.createElement(
                    "div"
                  );


                slot.className =
                  "slot";


                if(
                  foundWords.includes(
                    word
                  )
                ){

                  slot.textContent =
                    word[i];

                  slot.classList.add(
                    "found"
                  );

                }


                container.appendChild(
                  slot
                );

              }


              row.appendChild(
                container
              );

            }
          );


        wordsElement.appendChild(
          row
        );

      }
    );

}


/*
=================================================
 DRAW LETTERS
=================================================
*/

function drawLetters(){

  lettersElement.innerHTML =
    "";


  const total =
    currentLetters.length;


  const radius =
    total <= 4
      ? 92
      : total <= 5
        ? 101
        : 108;


  currentLetters.forEach(
    (item,index) => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "letter";


      button.textContent =
        item.letter;


      if(item.used){

        button.classList.add(
          "used"
        );

      }


      const angle =
        (
          index / total
        ) *
        Math.PI * 2
        -
        Math.PI/2;


      const x =
        50 +
        Math.cos(angle) *
        (radius/2.7);


      const y =
        50 +
        Math.sin(angle) *
        (radius/2.7);


      button.style.left =
        x + "%";


      button.style.top =
        y + "%";


      button.onclick =
        () =>
          chooseLetter(
            index
          );


      lettersElement.appendChild(
        button
      );

    }
  );

}


/*
=================================================
 CHOOSE LETTER
=================================================
*/

function chooseLetter(index){

  if(
    currentLetters[index].used
  )
    return;


  currentLetters[index].used =
    true;


  currentAnswer +=
    currentLetters[index].letter;


  updateAnswer();

  drawLetters();


  /*
    Automatically check once
    the answer matches a word.
  */

  const level =
    levels[
      currentLevel-1
    ];


  if(
    level.words.includes(
      currentAnswer
    )
  ){

    submitWord();

  }

}


/*
=================================================
 UPDATE ANSWER
=================================================
*/

function updateAnswer(){

  answerElement.textContent =
    currentAnswer ||
    " ";

}


/*
=================================================
 SUBMIT WORD
=================================================
*/

function submitWord(){

  const word =
    currentAnswer.toUpperCase();


  const level =
    levels[
      currentLevel-1
    ];


  if(
    !level.words.includes(
      word
    )
  ){

    messageElement.textContent =
      "❌ Not a word for this level";

    shakeAnswer();

    return;

  }


  if(
    foundWords.includes(
      word
    )
  ){

    messageElement.textContent =
      "Already found 👀";

    clearAnswer();

    return;

  }


  foundWords.push(
    word
  );


  foundCount =
    foundWords.length;


  /*
    Reward.
  */

  const reward =
    word.length * 3;


  coins +=
    reward;


  streak++;


  messageElement.textContent =
    `✅ ${word}  +${reward} coins`;


  save();


  drawWords();

  updateStats();

  updateProgress();


  clearAnswer();


  /*
    Level complete.
  */

  if(
    foundWords.length ===
    level.words.length
  ){

    setTimeout(
      completeLevel,
      650
    );

  }

}


/*
=================================================
 CLEAR
=================================================
*/

function clearAnswer(){

  currentAnswer =
    "";


  currentLetters.forEach(
    item =>
      item.used = false
  );


  updateAnswer();

  drawLetters();

}


/*
=================================================
 SHUFFLE
=================================================
*/

function shuffleLetters(){

  for(
    let i =
      currentLetters.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      currentLetters[i],
      currentLetters[j]
    ] =
    [
      currentLetters[j],
      currentLetters[i]
    ];

  }


  drawLetters();

}


/*
=================================================
 HINT
=================================================
*/

function useHint(){

  if(coins < 10){

    messageElement.textContent =
      "You need 10 coins for a hint.";

    return;

  }


  const level =
    levels[
      currentLevel-1
    ];


  const remaining =
    level.words.filter(
      word =>
        !foundWords.includes(
          word
        )
    );


  if(!remaining.length)
    return;


  const word =
    remaining[
      Math.floor(
        Math.random() *
        remaining.length
      )
    ];


  coins -=
    10;


  /*
    Reveal first letter
    temporarily.
  */

  messageElement.textContent =
    `💡 Try a word starting with "${word[0]}"`;

  coinsElement.textContent =
    coins;


  save();

}


/*
=================================================
 PROGRESS
=================================================
*/

function updateProgress(){

  const level =
    levels[
      currentLevel-1
    ];


  const percentage =
    (
      foundWords.length /
      level.words.length
    ) * 100;


  progressBar.style.width =
    percentage + "%";

}


/*
=================================================
 STATS
=================================================
*/

function updateStats(){

  coinsElement.textContent =
    coins;

  streakElement.textContent =
    streak;

  foundElement.textContent =
    foundCount;

}


/*
=================================================
 SHAKE
=================================================
*/

function shakeAnswer(){

  answerElement.animate(
    [
      {transform:"translateX(-7px)"},
      {transform:"translateX(7px)"},
      {transform:"translateX(-5px)"},
      {transform:"translateX(5px)"},
      {transform:"translateX(0)"}
    ],
    {
      duration:300
    }
  );

}


/*
=================================================
 LEVEL COMPLETE
=================================================
*/

function completeLevel(){

  const reward =
    25 +
    currentLevel * 5;


  coins +=
    reward;


  save();


  document.getElementById(
    "levelReward"
  ).textContent =
    `You earned ${reward} bonus coins!`;


  document.getElementById(
    "levelOverlay"
  ).classList.add(
    "show"
  );

}


/*
=================================================
 NEXT LEVEL
=================================================
*/

function nextLevel(){

  document.getElementById(
    "levelOverlay"
  ).classList.remove(
    "show"
  );


  if(
    currentLevel >=
    levels.length
  ){

    document.getElementById(
      "gameOverlay"
    ).classList.add(
      "show"
    );

    return;

  }


  currentLevel++;


  save();

  loadLevel();

}


/*
=================================================
 RESTART
=================================================
*/

function restartGame(){

  currentLevel =
    1;

  coins =
    100;

  streak =
    0;


  save();


  document.getElementById(
    "gameOverlay"
  ).classList.remove(
    "show"
  );


  loadLevel();

}


/*
=================================================
 INITIALIZE
=================================================
*/

loadLevel();

</script>

</body>
    </html>
