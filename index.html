<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Parking Jam</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#10131b;
  color:#fff;
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:15px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.coin-box{
  background:#202633;
  padding:9px 13px;
  border-radius:14px;
}

/* INFO */

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.level{
  font-size:24px;
  font-weight:900;
}

.moves{
  color:#aab2c2;
}

/* BOARD */

.board-wrap{
  display:flex;
  justify-content:center;
}

.board{
  position:relative;

  width:min(92vw,440px);
  aspect-ratio:4/5;

  background:
    linear-gradient(90deg,
      rgba(255,255,255,.045) 2px,
      transparent 2px),
    linear-gradient(
      rgba(255,255,255,.045) 2px,
      transparent 2px),
    #303640;

  background-size:20% 20%;

  border:8px solid #565e68;
  border-radius:20px;

  overflow:hidden;

  box-shadow:
    inset 0 0 30px #111,
    0 18px 40px rgba(0,0,0,.45);
}

/* PARKING MARKINGS */

.line{
  position:absolute;
  border:2px dashed rgba(255,255,255,.18);
}

.l1{
  left:20%;
  top:0;
  height:100%;
}

.l2{
  left:40%;
  top:0;
  height:100%;
}

.l3{
  left:60%;
  top:0;
  height:100%;
}

.l4{
  left:80%;
  top:0;
  height:100%;
}

/* EXIT */

.exit{
  position:absolute;
  left:-2px;
  top:42%;
  width:55px;
  height:16%;

  background:#24c77a;
  color:#07150e;

  border-radius:0 13px 13px 0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:900;
  font-size:12px;

  z-index:2;
}

/* =========================
   CAR
========================= */

.car{
  position:absolute;

  border-radius:14px;

  border:3px solid rgba(255,255,255,.75);

  box-shadow:
    0 8px 10px rgba(0,0,0,.45),
    inset 0 0 10px rgba(255,255,255,.18);

  z-index:10;

  transition:
    left .45s ease,
    top .45s ease;

  user-select:none;
}

/* horizontal car */

.car.horizontal{
  width:21%;
  height:12%;
}

/* vertical car */

.car.vertical{
  width:12%;
  height:21%;
}

/* windshield */

.car.horizontal .window{
  position:absolute;
  left:27%;
  top:13%;
  width:46%;
  height:74%;

  background:#b9e4ef;
  border-radius:7px;

  border:2px solid rgba(0,0,0,.25);
}

.car.vertical .window{
  position:absolute;
  left:13%;
  top:27%;
  width:74%;
  height:46%;

  background:#b9e4ef;
  border-radius:7px;

  border:2px solid rgba(0,0,0,.25);
}

/* wheels */

.wheel{
  position:absolute;

  width:17%;
  height:28%;

  background:#111;
  border-radius:50%;
}

.horizontal .wheel:nth-child(2){
  left:8%;
  top:-13%;
}

.horizontal .wheel:nth-child(3){
  right:8%;
  top:-13%;
}

.horizontal .wheel:nth-child(4){
  left:8%;
  bottom:-13%;
}

.horizontal .wheel:nth-child(5){
  right:8%;
  bottom:-13%;
}

.vertical .wheel:nth-child(2){
  left:-13%;
  top:8%;
}

.vertical .wheel:nth-child(3){
  right:-13%;
  top:8%;
}

.vertical .wheel:nth-child(4){
  left:-13%;
  bottom:8%;
}

.vertical .wheel:nth-child(5){
  right:-13%;
  bottom:8%;
}

/* COLORS */

.red{
  background:#e74c3c;
}

.blue{
  background:#287be8;
}

.yellow{
  background:#f1c40f;
}

.green{
  background:#2ecc71;
}

.purple{
  background:#9b59b6;
}

.orange{
  background:#e67e22;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;

  margin-top:15px;
}

.control{
  border:0;
  background:#202633;
  color:white;

  border-radius:13px;

  padding:13px 5px;

  font-weight:bold;
}

.control:active{
  transform:scale(.96);
}

/* LEVEL SELECT */

.level-btn{
  width:100%;
  margin-top:10px;

  padding:14px;

  border:0;
  border-radius:13px;

  background:#fff;
  color:#111;

  font-weight:900;
}

/* MESSAGE */

.message{
  text-align:center;

  color:#8993a5;

  font-size:12px;

  margin-top:12px;
}

/* POPUP */

.popup-bg{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.78);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.popup-bg.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;

  background:#1b2230;

  border-radius:23px;

  padding:25px;

  text-align:center;
}

.popup-icon{
  font-size:55px;
}

.popup h2{
  margin:8px 0;
}

.popup p{
  color:#aeb6c5;
  font-size:14px;
  line-height:1.5;
}

.popup button{
  width:100%;

  margin-top:10px;

  padding:13px;

  border:0;

  border-radius:12px;

  background:white;
  color:#111;

  font-weight:bold;
}

.popup .dark{
  background:#30394b;
  color:white;
}

/* LEVEL MENU */

.level-menu{
  position:fixed;
  inset:0;

  background:#10131b;

  z-index:90;

  display:none;

  overflow:auto;

  padding:20px;
}

.level-menu.show{
  display:block;
}

.level-menu h2{
  margin-bottom:18px;
}

.level-grid{
  max-width:500px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:9px;
}

.level-item{
  border:1px solid #343c4b;

  background:#202633;

  color:white;

  min-height:65px;

  border-radius:13px;
}

.level-item.locked{
  opacity:.3;
}

.level-item.current{
  border:2px solid white;
}

.back{
  margin-bottom:20px;

  padding:10px 15px;

  border:0;
  border-radius:11px;

  background:#202633;
  color:white;
}

/* TOAST */

.toast{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:translate(-50%,20px);

  background:white;
  color:#111;

  padding:11px 18px;

  border-radius:30px;

  font-size:13px;
  font-weight:bold;

  opacity:0;

  transition:.25s;

  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      🚗 Parking Jam
    </div>

    <div class="coin-box">
      🪙 <span id="coins">0</span>
    </div>

  </div>


  <div class="info">

    <div class="level">
      Level <span id="level">1</span>
    </div>

    <div class="moves">
      Moves: <span id="moves">0</span>
    </div>

  </div>


  <div class="board-wrap">

    <div class="board" id="board">

      <div class="line l1"></div>
      <div class="line l2"></div>
      <div class="line l3"></div>
      <div class="line l4"></div>

      <div class="exit">
        EXIT
      </div>

    </div>

  </div>


  <div class="controls">

    <button class="control"
            onclick="undo()">
      ↩️ Undo
    </button>

    <button class="control"
            onclick="hint()">
      💡 Hint
    </button>

    <button class="control"
            onclick="resetLevel()">
      🔄 Reset
    </button>

  </div>


  <button class="level-btn"
          onclick="openLevelMenu()">

    📋 Level Select

  </button>


  <div class="message">
    Tap a car to move it toward the exit.
  </div>

</div>


<!-- WIN -->

<div class="popup-bg" id="win">

  <div class="popup">

    <div class="popup-icon">
      🎉
    </div>

    <h2>Level Complete!</h2>

    <p id="winText"></p>

    <button onclick="nextLevel()">
      Next Level 🚗
    </button>

    <button class="dark"
            onclick="openLevelMenu()">

      Level Select

    </button>

  </div>

</div>


<!-- LOCKED -->

<div class="popup-bg" id="locked">

  <div class="popup">

    <div class="popup-icon">
      🔒
    </div>

    <h2>Locked</h2>

    <p>
      Complete the previous level to unlock this level.
    </p>

    <button onclick="closeLocked()">
      Okay
    </button>

  </div>

</div>


<!-- LEVEL MENU -->

<div class="level-menu" id="levelMenu">

  <button class="back"
          onclick="closeLevelMenu()">
    ← Back
  </button>

  <h2>
    Choose Level
  </h2>

  <div class="level-grid"
       id="levelGrid">
  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ==========================================
   SAVE DATA
========================================== */

let currentLevel =
  Number(
    localStorage.getItem(
      "pj_current"
    )
  ) || 1;


let unlockedLevel =
  Number(
    localStorage.getItem(
      "pj_unlocked"
    )
  ) || 1;


let coins =
  Number(
    localStorage.getItem(
      "pj_coins"
    )
  ) || 0;


let stars =
  JSON.parse(
    localStorage.getItem(
      "pj_stars"
    ) || "{}"
  );


/* ==========================================
   GAME DATA
========================================== */

let cars = [];

let originalCars = [];

let history = [];

let moves = 0;


/*
  These are fixed starter levels.

  Every level has a red horizontal
  car that can leave through the exit.
*/

const levels = [

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },

    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:48,
      y:10
    },

    {
      id:3,
      color:"yellow",
      dir:"vertical",
      x:72,
      y:23
    }
  ],


  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },

    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:47,
      y:8
    },

    {
      id:3,
      color:"green",
      dir:"vertical",
      x:70,
      y:10
    },

    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:8,
      y:68
    }
  ],


  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },

    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:47,
      y:8
    },

    {
      id:3,
      color:"green",
      dir:"vertical",
      x:70,
      y:10
    },

    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:7,
      y:68
    },

    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:72,
      y:63
    }
  ],


  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },

    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:47,
      y:8
    },

    {
      id:3,
      color:"green",
      dir:"vertical",
      x:70,
      y:10
    },

    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:7,
      y:68
    },

    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:58,
      y:63
    },

    {
      id:6,
      color:"orange",
      dir:"horizontal",
      x:38,
      y:80
    }
  ],


  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },

    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:47,
      y:8
    },

    {
      id:3,
      color:"green",
      dir:"vertical",
      x:70,
      y:10
    },

    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:7,
      y:68
    },

    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:58,
      y:63
    },

    {
      id:6,
      color:"orange",
      dir:"horizontal",
      x:38,
      y:80
    },

    {
      id:7,
      color:"blue",
      dir:"horizontal",
      x:68,
      y:80
    }
  ]

];


/* ==========================================
   LOAD
========================================== */

function loadLevel(level){

  currentLevel = level;

  const template =
    levels[
      Math.min(
        level - 1,
        levels.length - 1
      )
    ];


  cars =
    JSON.parse(
      JSON.stringify(template)
    );


  originalCars =
    JSON.parse(
      JSON.stringify(cars)
    );


  history = [];

  moves = 0;

  save();

  render();

}


/* ==========================================
   RENDER CAR
========================================== */

function render(){

  const board =
    document.getElementById(
      "board"
    );


  board
    .querySelectorAll(
      ".car"
    )
    .forEach(
      car => car.remove()
    );


  cars.forEach(
    car => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        `car ${car.color} ${car.dir}`;


      element.style.left =
        car.x + "%";


      element.style.top =
        car.y + "%";


      /*
        Build the car completely
        from HTML/CSS.
      */

      element.innerHTML = `
        <div class="window"></div>

        <div class="wheel"></div>
        <div class="wheel"></div>
        <div class="wheel"></div>
        <div class="wheel"></div>
      `;


      element.onclick =
        () =>
          moveCar(
            car.id
          );


      board.appendChild(
        element
      );

    }
  );


  document.getElementById(
    "level"
  ).textContent =
    currentLevel;


  document.getElementById(
    "moves"
  ).textContent =
    moves;


  document.getElementById(
    "coins"
  ).textContent =
    coins;

}


/* ==========================================
   MOVE
========================================== */

function moveCar(id){

  const car =
    cars.find(
      c => c.id === id
    );


  if(!car)
    return;


  /*
    Save previous position.
  */

  history.push(
    JSON.parse(
      JSON.stringify(cars)
    )
  );


  /*
    Horizontal cars move left.
  */

  if(
    car.dir === "horizontal"
  ){

    /*
      Check cars blocking the
      same horizontal lane.
    */

    const blocked =
      cars.some(
        other =>
          other.id !== car.id &&
          Math.abs(
            other.y - car.y
          ) < 9 &&
          other.x < car.x &&
          other.x > 5
      );


    if(blocked){

      history.pop();

      toast(
        "🚧 Path blocked!"
      );

      return;

    }


    car.x = -24;

  }


  /*
    Vertical cars move down.
  */

  else{

    const blocked =
      cars.some(
        other =>
          other.id !== car.id &&
          Math.abs(
            other.x - car.x
          ) < 9 &&
          other.y > car.y &&
          other.y < 90
      );


    if(blocked){

      history.pop();

      toast(
        "🚧 Path blocked!"
      );

      return;

    }


    car.y = 115;

  }


  moves++;

  render();


  setTimeout(
    () => {

      cars =
        cars.filter(
          car =>
            car.x > -20 &&
            car.y < 110
        );


      render();


      if(
        cars.length === 0
      ){

        winLevel();

      }

    },
    500
  );

}


/* ==========================================
   UNDO
========================================== */

function undo(){

  if(
    history.length === 0
  ){

    toast(
      "Nothing to undo."
    );

    return;

  }


  cars =
    history.pop();


  moves =
    Math.max(
      0,
      moves - 1
    );


  render();

}


/* ==========================================
   RESET
========================================== */

function resetLevel(){

  cars =
    JSON.parse(
      JSON.stringify(
        originalCars
      )
    );


  history = [];

  moves = 0;

  render();

  toast(
    "Level reset."
  );

}


/* ==========================================
   HINT
========================================== */

function hint(){

  const first =
    document.querySelector(
      ".car"
    );


  if(!first)
    return;


  first.animate(
    [
      {
        transform:"scale(1)"
      },

      {
        transform:"scale(1.12)"
      },

      {
        transform:"scale(1)"
      }
    ],
    {
      duration:700,
      iterations:3
    }
  );


  toast(
    "💡 Try the highlighted car."
  );

}


/* ==========================================
   WIN
========================================== */

function winLevel(){

  /*
    Calculate stars.
  */

  let rating = 3;


  if(
    moves > cars.length * 3
  )
    rating = 2;


  if(
    moves > cars.length * 5
  )
    rating = 1;


  stars[currentLevel] =
    Math.max(
      stars[currentLevel] || 0,
      rating
    );


  /*
    IMPORTANT:

    Only unlock the NEXT level after
    the current level is completed.
  */

  if(
    currentLevel === unlockedLevel &&
    unlockedLevel < 50
  ){

    unlockedLevel++;

  }


  const reward =
    10 + rating * 5;


  coins += reward;

  save();


  document.getElementById(
    "winText"
  ).textContent =
    "⭐".repeat(rating) +
    "  You earned " +
    reward +
    " coins!";


  document
    .getElementById(
      "win"
    )
    .classList.add(
      "show"
    );

}


/* ==========================================
   NEXT
========================================== */

function nextLevel(){

  document
    .getElementById(
      "win"
    )
    .classList.remove(
      "show"
    );


  loadLevel(
    currentLevel + 1
  );

}


/* ==========================================
   LEVEL MENU
========================================== */

function openLevelMenu(){

  document
    .getElementById(
      "levelMenu"
    )
    .classList.add(
      "show"
    );


  renderLevelMenu();

}


function closeLevelMenu(){

  document
    .getElementById(
      "levelMenu"
    )
    .classList.remove(
      "show"
    );

}


function renderLevelMenu(){

  const grid =
    document.getElementById(
      "levelGrid"
    );


  grid.innerHTML = "";


  for(
    let i=1;
    i<=50;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "level-item";


    if(
      i > unlockedLevel
    ){

      button.classList.add(
        "locked"
      );

      button.innerHTML =
        "🔒";

    }else{

      button.innerHTML =
        `
        <b>${i}</b><br>
        ${
          stars[i]
            ? "⭐".repeat(stars[i])
            : "—"
        }
        `;

    }


    if(
      i === currentLevel
    ){

      button.classList.add(
        "current"
      );

    }


    button.onclick =
      () => {

        if(
          i > unlockedLevel
        ){

          document
            .getElementById(
              "locked"
            )
            .classList.add(
              "show"
            );

          return;

        }


        loadLevel(i);

        closeLevelMenu();

      };


    grid.appendChild(
      button
    );

  }

}


/* ==========================================
   LOCKED POPUP
========================================== */

function closeLocked(){

  document
    .getElementById(
      "locked"
    )
    .classList.remove(
      "show"
    );

}


/* ==========================================
   SAVE
========================================== */

function save(){

  localStorage.setItem(
    "pj_current",
    currentLevel
  );

  localStorage.setItem(
    "pj_unlocked",
    unlockedLevel
  );

  localStorage.setItem(
    "pj_coins",
    coins
  );

  localStorage.setItem(
    "pj_stars",
    JSON.stringify(
      stars
    )
  );

}


/* ==========================================
   TOAST
========================================== */

let toastTimer;


function toast(text){

  const box =
    document.getElementById(
      "toast"
    );


  box.textContent =
    text;


  box.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        box.classList.remove(
          "show"
        );

      },
      1600
    );

}


/* ==========================================
   START GAME
========================================== */

loadLevel(
  currentLevel
);

</script>

</body>
</html>
