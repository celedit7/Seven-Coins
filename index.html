<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Celedit Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#28334c,#0b0f18 65%);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:560px;
  padding:14px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.badge{
  background:#202939;
  padding:8px 11px;
  border-radius:12px;
  font-size:12px;
}

.turn{
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
  min-height:20px;
}

/* BOARD */

.board{
  width:min(94vw,520px);
  aspect-ratio:1;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);

  background:#f2f2f2;

  border:7px solid #222a36;
  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 20px 45px rgba(0,0,0,.45);
}

/* BASE AREAS */

.base{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:8%;
  padding:13%;
}

.base.red{
  grid-column:1/7;
  grid-row:1/7;
  background:#e74c3c;
}

.base.green{
  grid-column:10/16;
  grid-row:1/7;
  background:#2ecc71;
}

.base.yellow{
  grid-column:10/16;
  grid-row:10/16;
  background:#f1c40f;
}

.base.blue{
  grid-column:1/7;
  grid-row:10/16;
  background:#3498db;
}

.home-token{
  background:#fff;
  border-radius:50%;
  box-shadow:
    inset 0 0 5px rgba(0,0,0,.25);
}

/* PATH */

.cell{
  position:relative;
  border:1px solid rgba(0,0,0,.08);
  background:#fff;
}

/* player paths */

.red-path{
  background:#f7b4ae;
}

.green-path{
  background:#a9e8be;
}

.yellow-path{
  background:#f7e79a;
}

.blue-path{
  background:#a9d7f4;
}

/* CENTER */

.center{
  grid-column:7/10;
  grid-row:7/10;

  background:
    conic-gradient(
      #2ecc71 0 25%,
      #f1c40f 25% 50%,
      #3498db 50% 75%,
      #e74c3c 75% 100%
    );

  position:relative;
}

.center::after{
  content:"";
  position:absolute;
  inset:22%;
  background:white;
  clip-path:polygon(
    50% 0,
    100% 50%,
    50% 100%,
    0 50%
  );
}

/* TOKEN */

.token{
  position:absolute;

  width:75%;
  height:75%;

  left:12.5%;
  top:12.5%;

  border-radius:50%;

  z-index:20;

  border:2px solid rgba(0,0,0,.3);

  box-shadow:
    0 3px 4px rgba(0,0,0,.35),
    inset 3px 3px 4px rgba(255,255,255,.35);

  cursor:pointer;

  transition:
    left .25s,
    top .25s,
    transform .15s;
}

.token:hover{
  transform:scale(1.08);
}

.token.red{
  background:#d92f25;
}

.token.green{
  background:#20ad58;
}

.token.yellow{
  background:#e0ad00;
}

.token.blue{
  background:#2578c4;
}

.token.selectable{
  animation:
    pulse .8s infinite alternate;
}

@keyframes pulse{
  from{
    transform:scale(1);
  }
  to{
    transform:scale(1.18);
  }
}

/* DICE */

.dice-area{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:14px;
}

.dice{
  width:70px;
  height:70px;

  border-radius:16px;

  background:white;
  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:40px;
  font-weight:900;

  box-shadow:
    0 7px 15px rgba(0,0,0,.3);
}

.roll{
  border:0;
  background:#fff;
  color:#111;

  padding:13px 22px;

  border-radius:13px;

  font-weight:900;
}

.roll:disabled{
  opacity:.35;
}

.controls{
  display:flex;
  justify-content:center;
  margin-top:10px;
}

.reset{
  border:0;
  background:#202939;
  color:white;
  padding:10px 20px;
  border-radius:12px;
}

.info{
  text-align:center;
  color:#8f9bae;
  font-size:12px;
  margin-top:10px;
  line-height:1.5;
}

/* WIN */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.8);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:340px;

  background:#18202e;

  border-radius:24px;

  padding:28px;

  text-align:center;
}

.popup .emoji{
  font-size:60px;
}

.popup h2{
  margin:8px 0;
}

.popup p{
  color:#aeb7c7;
  line-height:1.5;
}

.popup button{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:white;
  color:#111;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

<header>
  <div class="logo">
    🎲 Celedit Ludo
  </div>

  <div class="badge">
    YOU 🔵 vs 🤖
  </div>
</header>

<div class="turn" id="turn">
  Your turn
</div>

<div class="board" id="board">

  <!-- BASES -->

  <div class="base red">
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
  </div>

  <div class="base green">
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
  </div>

  <div class="base blue">
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
  </div>

  <div class="base yellow">
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
    <div class="home-token"></div>
  </div>

  <!-- BOARD PATH CELLS -->

  <div class="cell red-path" style="grid-column:7;grid-row:1"></div>
  <div class="cell red-path" style="grid-column:7;grid-row:2"></div>
  <div class="cell red-path" style="grid-column:7;grid-row:3"></div>

  <div class="cell green-path" style="grid-column:8;grid-row:1"></div>
  <div class="cell green-path" style="grid-column:8;grid-row:2"></div>
  <div class="cell green-path" style="grid-column:8;grid-row:3"></div>

  <div class="cell" style="grid-column:7;grid-row:4"></div>
  <div class="cell" style="grid-column:8;grid-row:4"></div>

  <div class="cell" style="grid-column:7;grid-row:5"></div>
  <div class="cell" style="grid-column:8;grid-row:5"></div>

  <div class="cell" style="grid-column:7;grid-row:6"></div>
  <div class="cell" style="grid-column:8;grid-row:6"></div>

  <div class="cell" style="grid-column:1;grid-row:7"></div>
  <div class="cell" style="grid-column:2;grid-row:7"></div>
  <div class="cell" style="grid-column:3;grid-row:7"></div>
  <div class="cell" style="grid-column:4;grid-row:7"></div>
  <div class="cell" style="grid-column:5;grid-row:7"></div>
  <div class="cell" style="grid-column:6;grid-row:7"></div>

  <div class="cell" style="grid-column:10;grid-row:7"></div>
  <div class="cell" style="grid-column:11;grid-row:7"></div>
  <div class="cell" style="grid-column:12;grid-row:7"></div>
  <div class="cell" style="grid-column:13;grid-row:7"></div>
  <div class="cell" style="grid-column:14;grid-row:7"></div>
  <div class="cell" style="grid-column:15;grid-row:7"></div>

  <div class="cell" style="grid-column:7;grid-row:10"></div>
  <div class="cell" style="grid-column:8;grid-row:10"></div>

  <div class="cell" style="grid-column:7;grid-row:11"></div>
  <div class="cell" style="grid-column:8;grid-row:11"></div>

  <div class="cell" style="grid-column:7;grid-row:12"></div>
  <div class="cell" style="grid-column:8;grid-row:12"></div>

  <div class="cell" style="grid-column:7;grid-row:13"></div>
  <div class="cell" style="grid-column:8;grid-row:13"></div>

  <div class="cell blue-path" style="grid-column:7;grid-row:14"></div>
  <div class="cell blue-path" style="grid-column:7;grid-row:15"></div>

  <div class="cell yellow-path" style="grid-column:8;grid-row:14"></div>
  <div class="cell yellow-path" style="grid-column:8;grid-row:15"></div>

  <div class="center"></div>

</div>

<div class="dice-area">

  <div class="dice" id="dice">
    ⚀
  </div>

  <button
    class="roll"
    id="roll"
    onclick="rollDice()">

    🎲 Roll Dice

  </button>

</div>

<div class="controls">

  <button
    class="reset"
    onclick="resetGame()">

    🔄 New Game

  </button>

</div>

<div class="info">
  Roll a 6 to bring a token onto the board.<br>
  Capture the computer's token by landing on it.
</div>

</div>


<div class="overlay" id="win">

  <div class="popup">

    <div class="emoji">
      🏆
    </div>

    <h2 id="winTitle">
      You Win!
    </h2>

    <p id="winText"></p>

    <button onclick="resetGame()">
      Play Again
    </button>

  </div>

</div>


<script>

/*
==========================================
  CELEDIT LUDO PROTOTYPE

  Player = BLUE
  Computer = RED

  This is the first playable prototype.
==========================================
*/


const board =
  document.getElementById("board");

const diceElement =
  document.getElementById("dice");

const rollButton =
  document.getElementById("roll");

const turnElement =
  document.getElementById("turn");


let turn = "player";

let diceValue = 0;

let gameOver = false;


/*
  Each token position:

  -1 = home
   0+ = board position
*/

let playerTokens =
  [-1,-1,-1,-1];

let computerTokens =
  [-1,-1,-1,-1];


/*
  Main circular path.

  These are board coordinates.
*/

const path = [

  [7,6],
  [7,5],
  [7,4],
  [7,3],
  [8,3],
  [9,3],
  [9,4],
  [9,5],
  [9,6],
  [10,7],
  [11,7],
  [12,7],
  [13,7],
  [14,7],
  [14,8],
  [13,8],
  [12,8],
  [11,8],
  [10,8],
  [9,9],
  [9,10],
  [9,11],
  [9,12],
  [9,13],
  [8,13],
  [7,13],
  [7,12],
  [7,11],
  [7,10],
  [6,9],
  [5,9],
  [4,9],
  [3,9],
  [2,9],
  [2,8],
  [3,8],
  [4,8],
  [5,8],
  [6,8],
  [5,7],
  [4,7],
  [3,7],
  [2,7],
  [1,7],
  [1,6],
  [2,6],
  [3,6],
  [4,6],
  [5,6],
  [6,5],
  [6,4],
  [6,3],
  [6,2],
  [7,2],
  [8,2],
  [8,3]

];


/*
  Starting points.

  Blue starts around bottom-left.
  Red starts around top-left.
*/

const PLAYER_START = 27;

const COMPUTER_START = 1;


/*
  Home token visual positions.
*/

const playerHome = [
  [2,11],
  [4,11],
  [2,13],
  [4,13]
];

const computerHome = [
  [2,2],
  [4,2],
  [2,4],
  [4,4]
];


/*
  Create visual tokens.
*/

function createTokens(){

  board
    .querySelectorAll(".token")
    .forEach(
      token => token.remove()
    );


  playerTokens.forEach(
    (position,index) => {

      createToken(
        "blue",
        position,
        index,
        true
      );

    }
  );


  computerTokens.forEach(
    (position,index) => {

      createToken(
        "red",
        position,
        index,
        false
      );

    }
  );

}


/*
  Create one token.
*/

function createToken(
  color,
  position,
  index,
  isPlayer
){

  const token =
    document.createElement("div");

  token.className =
    `token ${color}`;

  /*
    Home position.
  */

  if(position === -1){

    const home =
      isPlayer
        ? playerHome[index]
        : computerHome[index];

    token.style.gridColumn =
      home[0];

    token.style.gridRow =
      home[1];

    /*
      Because tokens are absolutely
      positioned, calculate using
      board percentage.
    */

    token.style.left =
      ((home[0]-1)/15*100 + 2) + "%";

    token.style.top =
      ((home[1]-1)/15*100 + 2) + "%";

  }

  else{

    const coordinate =
      path[
        (position +
        (isPlayer
          ? PLAYER_START
          : COMPUTER_START))
        % path.length
      ];


    token.style.left =
      ((coordinate[1]-1)/15*100 + 1.2) + "%";

    token.style.top =
      ((coordinate[0]-1)/15*100 + 1.2) + "%";

  }


  if(
    isPlayer &&
    turn === "player" &&
    diceValue &&
    canMove(
      playerTokens[index],
      diceValue
    )
  ){

    token.classList.add(
      "selectable"
    );

    token.onclick =
      () =>
        movePlayer(index);

  }


  board.appendChild(token);

}


/*
==========================================
  CAN MOVE
==========================================
*/

function canMove(
  position,
  amount
){

  /*
    Token at home needs a 6.
  */

  if(position === -1){

    return amount === 6;

  }


  /*
    Don't allow movement beyond
    the finishing point.
  */

  return position + amount <= path.length;

}


/*
==========================================
  DICE
==========================================
*/

const diceFaces = [
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];


function rollDice(){

  if(
    gameOver ||
    turn !== "player"
  )
    return;


  rollButton.disabled = true;


  let rolls = 0;


  const animation =
    setInterval(
      () => {

        const random =
          Math.floor(
            Math.random()*6
          );


        diceElement.textContent =
          diceFaces[random];


        rolls++;


        if(rolls >= 8){

          clearInterval(animation);


          diceValue =
            Math.floor(
              Math.random()*6
            ) + 1;


          diceElement.textContent =
            diceFaces[
              diceValue-1
            ];


          afterPlayerRoll();

        }

      },
      70
    );

}


/*
==========================================
  AFTER PLAYER ROLL
==========================================
*/

function afterPlayerRoll(){

  turnElement.textContent =
    "You rolled " +
    diceValue;


  /*
    Check whether any token can move.
  */

  const movable =
    playerTokens.some(
      position =>
        canMove(
          position,
          diceValue
        )
    );


  if(!movable){

    /*
      No move.

      Six gives another roll.
    */

    if(diceValue === 6){

      turnElement.textContent =
        "No move. Roll again!";

      setTimeout(
        () => {

          rollButton.disabled =
            false;

          diceValue = 0;

        },
        800
      );

      return;

    }


    setTimeout(
      computerTurn,
      900
    );

    return;

  }


  createTokens();

}


/*
==========================================
  PLAYER MOVE
==========================================
*/

function movePlayer(index){

  if(
    gameOver ||
    turn !== "player"
  )
    return;


  if(
    !canMove(
      playerTokens[index],
      diceValue
    )
  )
    return;


  /*
    Six brings a token out.
  */

  if(
    playerTokens[index] === -1
  ){

    playerTokens[index] =
      0;

  }

  else{

    playerTokens[index] +=
      diceValue;

  }


  checkCapture(
    playerTokens[index],
    true
  );


  createTokens();


  if(
    checkWin(
      playerTokens
    )
  ){

    endGame(
      true
    );

    return;

  }


  /*
    Six = another turn.
  */

  if(
    diceValue === 6
  ){

    diceValue = 0;

    turnElement.textContent =
      "🎲 You get another roll!";

    rollButton.disabled =
      false;

    createTokens();

    return;

  }


  diceValue = 0;

  setTimeout(
    computerTurn,
    700
  );

}


/*
==========================================
  COMPUTER
==========================================
*/

function computerTurn(){

  if(gameOver)
    return;


  turn = "computer";

  turnElement.textContent =
    "🤖 Computer is thinking...";


  rollButton.disabled =
    true;


  setTimeout(
    () => {

      diceValue =
        Math.floor(
          Math.random()*6
        ) + 1;


      diceElement.textContent =
        diceFaces[
          diceValue-1
        ];


      const movable =
        computerTokens
          .map(
            (position,index) => ({
              position,
              index
            })
          )
          .filter(
            item =>
              canMove(
                item.position,
                diceValue
              )
          );


      if(
        movable.length === 0
      ){

        if(
          diceValue === 6
        ){

          turn = "player";

          turnElement.textContent =
            "Computer can't move. Your turn!";

          rollButton.disabled =
            false;

          return;

        }


        turn =
          "player";

        turnElement.textContent =
          "Your turn";

        rollButton.disabled =
          false;

        return;

      }


      /*
        Computer strategy:

        Prefer capturing the player.
        Otherwise move the token
        furthest along.
      */

      let chosen =
        movable[0];


      for(
        const option of movable
      ){

        const future =
          option.position === -1
            ? 0
            : option.position +
              diceValue;


        const capture =
          option.position !== -1 &&
          isCapturePosition(
            future,
            false
          );


        if(capture){

          chosen =
            option;

          break;

        }


        if(
          option.position >
          chosen.position
        ){

          chosen =
            option;

        }

      }


      moveComputer(
        chosen.index
      );

    },
    900
  );

}


/*
==========================================
  COMPUTER MOVE
==========================================
*/

function moveComputer(index){

  if(
    computerTokens[index] === -1
  ){

    computerTokens[index] =
      0;

  }

  else{

    computerTokens[index] +=
      diceValue;

  }


  checkCapture(
    computerTokens[index],
    false
  );


  createTokens();


  if(
    checkWin(
      computerTokens
    )
  ){

    endGame(
      false
    );

    return;

  }


  if(
    diceValue === 6
  ){

    turnElement.textContent =
      "🤖 Computer rolled 6... again!";

    setTimeout(
      computerTurn,
      900
    );

    return;

  }


  diceValue = 0;

  turn =
    "player";

  turnElement.textContent =
    "Your turn";

  rollButton.disabled =
    false;

  createTokens();

}


/*
==========================================
  CAPTURE
==========================================
*/

function checkCapture(
  position,
  player
){

  if(position < 0)
    return;


  if(
    player
  ){

    for(
      let i=0;
      i<computerTokens.length;
      i++
    ){

      if(
        computerTokens[i] !== -1 &&
        computerTokens[i] !== path.length &&
        sameBoardPosition(
          position,
          computerTokens[i],
          true,
          false
        )
      ){

        computerTokens[i] =
          -1;

        turnElement.textContent =
          "💥 You captured a token!";

      }

    }

  }else{

    for(
      let i=0;
      i<playerTokens.length;
      i++
    ){

      if(
        playerTokens[i] !== -1 &&
        playerTokens[i] !== path.length &&
        sameBoardPosition(
          position,
          computerTokens[player ? i : i],
          false,
          true
        )
      ){

        /*
          Actual comparison below.
        */

      }

    }


    for(
      let i=0;
      i<playerTokens.length;
      i++
    ){

      if(
        playerTokens[i] !== -1 &&
        playerTokens[i] !== path.length &&
        sameBoardPosition(
          position,
          playerTokens[i],
          false,
          true
        )
      ){

        playerTokens[i] =
          -1;

        turnElement.textContent =
          "💥 Computer captured your token!";

      }

    }

  }

}


/*
==========================================
  POSITION COMPARISON
==========================================
*/

function sameBoardPosition(
  a,
  b,
  aPlayer,
  bPlayer
){

  const aGlobal =
    (
      a +
      (aPlayer
        ? PLAYER_START
        : COMPUTER_START)
    ) % path.length;


  const bGlobal =
    (
      b +
      (bPlayer
        ? PLAYER_START
        : COMPUTER_START)
    ) % path.length;


  return aGlobal === bGlobal;

}


function isCapturePosition(
  position,
  player
){

  for(
    const token of playerTokens
  ){

    if(
      token !== -1 &&
      sameBoardPosition(
        position,
        token,
        false,
        true
      )
    ){

      return true;

    }

  }

  return false;

}


/*
==========================================
  WIN
==========================================
*/

function checkWin(
  tokens
){

  return t
