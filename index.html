<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celedit Tic Tac Toe</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#080d15;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:430px;
  padding:18px;
  text-align:center;
}

h1{
  font-size:27px;
  margin-bottom:5px;
}

.sub{
  color:#8492a5;
  font-size:13px;
  margin-bottom:18px;
}

/* CHOOSE SIDE */

.choose{
  background:#121b27;
  border:1px solid #263548;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
}

.choose p{
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.side-buttons{
  display:flex;
  gap:10px;
}

.side{
  flex:1;
  height:58px;
  border:2px solid #2c3b4d;
  border-radius:14px;
  background:#1a2533;
  color:white;
  font-size:26px;
  cursor:pointer;
}

.side.selected{
  border-color:#f1c40f;
  background:#29374a;
}

/* SCORE */

.scores{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-bottom:12px;
}

.score{
  background:#121b27;
  border-radius:12px;
  padding:9px;
}

.score b{
  display:block;
  font-size:21px;
}

.score small{
  color:#8290a2;
  font-size:10px;
}

/* TURN */

#turn{
  min-height:22px;
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

/* BOARD */

.board{
  width:min(92vw,380px);
  aspect-ratio:1;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:8px;
  padding:8px;

  background:#05090f;
  border-radius:22px;
}

.cell{
  width:100%;
  height:100%;

  border:0;
  border-radius:15px;

  background:#1b2735;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:60px;
  font-weight:900;

  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

.cell.x{
  color:#4da6ff;
}

.cell.o{
  color:#ff6077;
}

.cell.win{
  background:#34445a;
  animation:win .45s infinite alternate;
}

@keyframes win{
  to{
    transform:scale(.94);
  }
}

/* CONTROLS */

.controls{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.control{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px 8px;
  background:#202d3c;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.new{
  background:#f1c40f;
  color:#111;
}

/* DIFFICULTY */

.difficulty{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.diff{
  flex:1;
  border:1px solid #29394c;
  background:#111923;
  color:#7f8da0;
  border-radius:9px;
  padding:9px 3px;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
}

.diff.active{
  background:#29394c;
  color:#fff;
}

/* POPUP */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.86);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;
  z-index:100;
}

.popup-bg.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:340px;

  background:#17222f;
  border:1px solid #304054;

  border-radius:24px;
  padding:28px 20px;

  text-align:center;
}

.popup .icon{
  font-size:55px;
}

.popup h2{
  margin:8px 0;
  font-size:27px;
}

.popup p{
  color:#9aa7b7;
  margin-bottom:17px;
}

.continue{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#f1c40f;
  color:#111;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

@media(max-width:370px){

  .cell{
    font-size:50px;
  }

  .board{
    gap:6px;
    padding:6px;
  }

}
</style>
</head>

<body>

<div class="app">

  <h1>❌⭕ Celedit</h1>

  <div class="sub">
    Tic Tac Toe
  </div>


  <!-- CHOOSE SYMBOL -->

  <div class="choose">

    <p>Choose your symbol</p>

    <div class="side-buttons">

      <button
        type="button"
        class="side selected"
        id="xSide">
        ❌
      </button>

      <button
        type="button"
        class="side"
        id="oSide">
        ⭕
      </button>

    </div>

  </div>


  <!-- SCORE -->

  <div class="scores">

    <div class="score">
      <b id="youScore">0</b>
      <small>YOU</small>
    </div>

    <div class="score">
      <b id="drawScore">0</b>
      <small>DRAW</small>
    </div>

    <div class="score">
      <b id="cpuScore">0</b>
      <small>COMPUTER</small>
    </div>

  </div>


  <div id="turn">
    Your turn ❌
  </div>


  <!-- GAME BOARD -->

  <div
    class="board"
    id="board">

    <button type="button" class="cell" data-cell="0"></button>
    <button type="button" class="cell" data-cell="1"></button>
    <button type="button" class="cell" data-cell="2"></button>

    <button type="button" class="cell" data-cell="3"></button>
    <button type="button" class="cell" data-cell="4"></button>
    <button type="button" class="cell" data-cell="5"></button>

    <button type="button" class="cell" data-cell="6"></button>
    <button type="button" class="cell" data-cell="7"></button>
    <button type="button" class="cell" data-cell="8"></button>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      type="button"
      class="control new"
      id="newGame">
      🔄 New Game
    </button>

    <button
      type="button"
      class="control"
      id="reset">
      Reset Score
    </button>

  </div>


  <!-- DIFFICULTY -->

  <div class="difficulty">

    <button
      type="button"
      class="diff active"
      data-level="easy">
      EASY
    </button>

    <button
      type="button"
      class="diff"
      data-level="medium">
      MEDIUM
    </button>

    <button
      type="button"
      class="diff"
      data-level="hard">
      HARD
    </button>

  </div>

</div>


<!-- RESULT POPUP -->

<div
  class="popup-bg"
  id="popup">

  <div class="popup">

    <div
      class="icon"
      id="resultIcon">
      🏆
    </div>

    <h2
      id="resultTitle">
      You Win!
    </h2>

    <p
      id="resultMessage">
      Great game!
    </p>

    <button
      type="button"
      class="continue"
      id="continue">
      Continue
    </button>

  </div>

</div>


<script>

/* ==========================================
   GAME VARIABLES
========================================== */

let game = [
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  ""
];

let player = "X";

let computer = "O";

let current = "player";

let playing = true;

let level = "easy";


let score = {

  you:
    Number(
      localStorage.getItem(
        "ttt_you"
      )
    ) || 0,

  cpu:
    Number(
      localStorage.getItem(
        "ttt_cpu"
      )
    ) || 0,

  draw:
    Number(
      localStorage.getItem(
        "ttt_draw"
      )
    ) || 0

};


/* ==========================================
   ELEMENTS
========================================== */

const cells =
  document.querySelectorAll(".cell");

const turn =
  document.getElementById("turn");

const popup =
  document.getElementById("popup");

const resultIcon =
  document.getElementById("resultIcon");

const resultTitle =
  document.getElementById("resultTitle");

const resultMessage =
  document.getElementById("resultMessage");


/* ==========================================
   WINNING COMBINATIONS
========================================== */

const lines = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];


/* ==========================================
   BOARD CLICK
========================================== */

cells.forEach(function(cell){

  cell.addEventListener(
    "click",
    function(){

      const index =
        Number(
          cell.getAttribute(
            "data-cell"
          )
        );


      /*
        Only player can click
        during their turn.
      */

      if(
        !playing ||
        current !== "player" ||
        game[index] !== ""
      ){
        return;
      }


      game[index] =
        player;


      drawBoard();


      if(
        finishCheck()
      ){
        return;
      }


      current =
        "computer";


      showTurn();


      /*
        Give computer a small delay
        so it feels natural.
      */

      setTimeout(
        computerTurn,
        350
      );

    }
  );

});


/* ==========================================
   DRAW BOARD
========================================== */

function drawBoard(){

  cells.forEach(function(cell){

    const index =
      Number(
        cell.getAttribute(
          "data-cell"
        )
      );


    cell.textContent =
      game[index];


    cell.classList.remove(
      "x",
      "o"
    );


    if(
      game[index] === "X"
    ){

      cell.classList.add(
        "x"
      );

    }


    if(
      game[index] === "O"
    ){

      cell.classList.add(
        "o"
      );

    }

  });

}


/* ==========================================
   COMPUTER TURN
========================================== */

function computerTurn(){

  if(
    !playing
  )
    return;


  let move;


  if(
    level === "easy"
  ){

    move =
      randomMove();

  }

  else if(
    level === "medium"
  ){

    if(
      Math.random() < .65
    ){

      move =
        smartMove();

    }else{

      move =
        randomMove();

    }

  }

  else{

    move =
      hardMove();

  }


  if(
    move < 0
  )
    return;


  game[move] =
    computer;


  drawBoard();


  if(
    finishCheck()
  )
    return;


  current =
    "player";


  showTurn();

}


/* ==========================================
   RANDOM MOVE
========================================== */

function randomMove(){

  const empty = [];


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      game[i] === ""
    ){

      empty.push(i);

    }

  }


  if(
    empty.length === 0
  )
    return -1;


  return empty[
    Math.floor(
      Math.random() *
      empty.length
    )
  ];

}


/* ==========================================
   SMART MOVE
========================================== */

function smartMove(){

  /*
    Try to win.
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      game[i] !== ""
    )
      continue;


    game[i] =
      computer;


    if(
      hasWinner(computer)
    ){

      game[i] =
        "";

      return i;

    }


    game[i] =
      "";

  }


  /*
    Block player.
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      game[i] !== ""
    )
      continue;


    game[i] =
      player;


    if(
      hasWinner(player)
    ){

      game[i] =
        "";

      return i;

    }


    game[i] =
      "";

  }


  if(
    game[4] === ""
  )
    return 4;


  const corners =
    [0,2,6,8]
      .filter(
        function(i){
          return game[i] === "";
        }
      );


  if(
    corners.length
  ){

    return corners[
      Math.floor(
        Math.random() *
        corners.length
      )
    ];

  }


  return randomMove();

}


/* ==========================================
   HARD MOVE
========================================== */

function hardMove(){

  let bestScore =
    -Infinity;

  let bestMove =
    -1;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      game[i] !== ""
    )
      continue;


    game[i] =
      computer;


    const score =
      minimax(
        false
      );


    game[i] =
      "";


    if(
      score > bestScore
    ){

      bestScore =
        score;

      bestMove =
        i;

    }

  }


  return bestMove;

}


/* ==========================================
   MINIMAX
========================================== */

function minimax(
  maximizing
){

  if(
    hasWinner(computer)
  )
    return 10;


  if(
    hasWinner(player)
  )
    return -10;


  if(
    game.every(
      function(cell){
        return cell !== "";
      }
    )
  )
    return 0;


  if(
    maximizing
  ){

    let best =
      -Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(
        game[i] !== ""
      )
        continue;


      game[i] =
        computer;


      best =
        Math.max(
          best,
          minimax(false)
        );


      game[i] =
        "";

    }


    return best;

  }


  let best =
    Infinity;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      game[i] !== ""
    )
      continue;


    game[i] =
      player;


    best =
      Math.min(
        best,
        minimax(true)
      );


    game[i] =
      "";

  }


  return best;

}


/* ==========================================
   WINNER CHECK
========================================== */

function hasWinner(symbol){

  return lines.some(
    function(line){

      return (
        game[line[0]] === symbol &&
        game[line[1]] === symbol &&
        game[line[2]] === symbol
      );

    }
  );

}


/* ==========================================
   FINISH CHECK
========================================== */

function finishCheck(){

  /*
    WIN
  */

  for(
    const line of lines
  ){

    if(
      game[line[0]] !== "" &&
      game[line[0]] === game[line[1]] &&
      game[line[1]] === game[line[2]]
    ){

      playing =
        false;


      line.forEach(
        function(index){

          cells[index]
            .classList.add(
              "win"
            );

        }
      );


      const winner =
        game[line[0]];


      if(
        winner === player
      ){

        score.you++;


        showResult(
          "🏆",
          "You Win!",
          "Nice one! You got the round."
        );

      }

      else{

        score.cpu++;


        showResult(
          "🤖",
          "Computer Wins",
          "The computer got this round."
        );

      }


      saveScore();

      updateScore();


      return true;

    }

  }


  /*
    DRAW
  */

  let full =
    game.every(
      function(cell){
        return cell !== "";
      }
    );


  if(
    full
  ){

    playing =
      false;


    score.draw++;


    saveScore();

    updateScore();


    showResult(
      "🤝",
      "Draw!",
      "Nobody won this round."
    );


    return true;

  }


  return false;

}


/* ==========================================
   SHOW TURN
========================================== */

function showTurn(){

  if(
    current === "player"
  ){

    turn.textContent =
      "Your turn " +
      (
        player === "X"
          ? "❌"
          : "⭕"
      );

  }
  else{

    turn.textContent =
      "Computer is thinking... 🤖";

  }

}


/* ==========================================
   SYMBOL BUTTONS
========================================== */

document
  .getElementById("xSide")
  .addEventListener(
    "click",
    function(){

      player =
        "X";

      computer =
        "O";


      document
        .getElementById("xSide")
        .classList.add(
          "selected"
        );


      document
        .getElementById("oSide")
        .classList.remove(
          "selected"
        );


      newGame();

    }
  );


document
  .getElementById("oSide")
  .addEventListener(
    "click",
    function(){

      player =
        "O";

      computer =
        "X";


      document
        .getElementById("oSide")
        .classList.add(
          "selected"
        );


      document
        .getElementById("xSide")
        .classList.remove(
          "selected"
        );


      newGame();

    }
  );


/* ==========================================
   NEW GAME
========================================== */

function newGame(){

  game = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];


  playing =
    true;


  cells.forEach(
    function(cell){

      cell.textContent =
        "";

      cell.classList.remove(
        "x",
        "o",
        "win"
      );

    }
  );


  /*
    X always starts.
    Therefore if player chooses O,
    computer starts automatically.
  */

  if(
    player === "O"
  ){

    current =
      "computer";


    turn.textContent =
      "Computer starts ❌";


    setTimeout(
      computerTurn,
      400
    );

  }
  else{

    current =
      "player";


    showTurn();

  }

}


/* ==========================================
   CONTINUE BUTTON
========================================== */

document
  .getElementById("continue")
  .addEventListener(
    "click",
    function(){

      /*
        Close popup FIRST.
      */

      popup.classList.remove(
        "show"
      );


      /*
        Then completely reset
        the board.
      */

      newGame();

    }
  );


/* ==========================================
   NEW GAME BUTTON
========================================== */

document
  .getElementById("newGame")
  .addEventListener(
    "click",
    function(){

      popup.classList.remove(
        "show"
      );

      newGame();

    }
  );


/* ==========================================
   RESULT POPUP
========================================== */

function showResult(
  icon,
  title,
  message
){

  resultIcon.textContent =
    icon;

  resultTitle.textContent =
    title;

  resultMessage.textContent =
    message;


  popup.classList.add(
    "show"
  );

}


/* ==========================================
   DIFFICULTY
========================================== */

document
  .querySelectorAll(".diff")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          document
            .querySelectorAll(".diff")
            .forEach(
              function(b){
                b.classList.remove(
                  "active"
                );
              }
            );


          button.classList.add(
            "active"
          );


          level =
            button.getAttribute(
              "data-level"
            );


          newGame();

        }
      );

    }
  );


/* ==========================================
   SCORE
========================================== */

function updateScore(){

  document.getElementById(
    "youScore"
  ).textContent =
    score.you;


  document.getElementById(
    "cpuScore"
  ).textContent =
    score.cpu;


  document.getElementById(
    "drawScore"
  ).textContent =
    score.draw;

}


function saveScore(){

  localStorage.setItem(
    "ttt_you",
    score.you
  );


  localStorage.setItem(
    "ttt_cpu",
    score.cpu
  );


  localStorage.setItem(
    "ttt_draw",
    score.draw
  );

}


/* ==========================================
   RESET SCORE
========================================== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function(){

      score = {
        you:0,
        cpu:0,
        draw:0
      };


      saveScore();

      updateScore();

      popup.classList.remove(
        "show"
      );

      newGame();

    }
  );


/* ==========================================
   START
========================================== */

updateScore();

newGame();

</script>

</body>
  </html>
