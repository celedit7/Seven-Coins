<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Color Water Sort 3D</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#263b65 0,#10172a 35%,#070a12 75%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 15px 30px;
}

/* TOP */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.coin-box,
.sound-btn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:14px;
  padding:9px 12px;
  backdrop-filter:blur(10px);
}

.sound-btn{
  width:42px;
  height:40px;
  padding:0;
  font-size:18px;
}

/* LEVEL HEADER */

.level-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.level-name{
  font-size:25px;
  font-weight:900;
}

.moves{
  color:#b8c1d8;
  font-size:13px;
}

/* PROGRESS */

.progress-wrap{
  height:7px;
  border-radius:20px;
  background:rgba(255,255,255,.09);
  overflow:hidden;
  margin-bottom:20px;
}

.progress{
  height:100%;
  width:0%;
  background:#fff;
  border-radius:20px;
  transition:width .35s ease;
}

/* GAME BOARD */

.board{
  min-height:475px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:23px 18px;
  padding:22px 8px;
  perspective:900px;
}

/* TUBE */

.tube-wrap{
  width:67px;
  height:215px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:.2s ease;
}

.tube-wrap.selected{
  transform:translateY(-12px);
}

.tube-wrap.hint{
  animation:hintPulse .7s infinite alternate;
}

@keyframes hintPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.7)}
}

.tube{
  width:59px;
  height:190px;
  position:relative;
  overflow:hidden;

  border:2px solid rgba(255,255,255,.55);
  border-top:3px solid rgba(255,255,255,.72);
  border-radius:30px 30px 25px 25px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.20),
      rgba(255,255,255,.04) 25%,
      rgba(255,255,255,.10) 50%,
      rgba(255,255,255,.02) 75%,
      rgba(255,255,255,.17)
    );

  box-shadow:
    inset 8px 0 12px rgba(255,255,255,.08),
    inset -8px 0 12px rgba(0,0,0,.25),
    0 18px 28px rgba(0,0,0,.4);

  display:flex;
  flex-direction:column-reverse;
  justify-content:flex-start;
}

.tube:before{
  content:"";
  position:absolute;
  left:9px;
  top:8px;
  bottom:12px;
  width:5px;
  border-radius:10px;
  background:rgba(255,255,255,.22);
  z-index:5;
  pointer-events:none;
}

.tube:after{
  content:"";
  position:absolute;
  left:6px;
  right:6px;
  top:-4px;
  height:8px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.08);
  z-index:10;
}

/* WATER */

.water{
  width:100%;
  height:25%;
  position:relative;
  border-top:1px solid rgba(255,255,255,.3);
  overflow:hidden;
  flex-shrink:0;
}

.water:first-child{
  border-radius:0 0 22px 22px;
}

.water:before{
  content:"";
  position:absolute;
  left:-15%;
  top:-5px;
  width:130%;
  height:12px;
  border-radius:50%;
  background:rgba(255,255,255,.24);
  animation:wave 1.5s ease-in-out infinite;
}

@keyframes wave{
  0%,100%{transform:translateX(-3%)}
  50%{transform:translateX(3%)}
}

.red{
  background:linear-gradient(90deg,#9f1e2d,#ff5364,#b82032);
}

.blue{
  background:linear-gradient(90deg,#1264ae,#54b9ff,#1874bd);
}

.green{
  background:linear-gradient(90deg,#16864c,#52e28d,#159657);
}

.yellow{
  background:linear-gradient(90deg,#b98708,#ffe34f,#d0a20c);
}

.purple{
  background:linear-gradient(90deg,#6426a5,#c06aff,#762fc0);
}

.orange{
  background:linear-gradient(90deg,#bd5b0d,#ff9d3c,#d96c12);
}

.pink{
  background:linear-gradient(90deg,#b52c6e,#ff72b2,#c73479);
}

.cyan{
  background:linear-gradient(90deg,#0d8e9c,#53e6ee,#1099a6);
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:8px;
}

.control{
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:13px 5px;
  font-size:13px;
  font-weight:bold;
}

.control:active{
  transform:scale(.97);
}

.control.primary{
  background:#fff;
  color:#101010;
}

/* LEVEL BUTTON */

.level-button{
  margin-top:13px;
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  font-weight:bold;
}

/* INSTRUCTIONS */

.instructions{
  text-align:center;
  color:#8e99b3;
  font-size:12px;
  margin-top:15px;
  line-height:1.5;
}

/* LEVEL SELECT */

.level-screen{
  display:none;
}

.level-screen.active{
  display:block;
}

.game-screen.hidden{
  display:none;
}

.level-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.back{
  border:0;
  background:rgba(255,255,255,.09);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.level-card{
  min-height:78px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  background:rgba(255,255,255,.07);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.level-card.locked{
  opacity:.35;
}

.level-card.current{
  border-color:#fff;
}

.level-number{
  font-size:20px;
  font-weight:900;
}

.stars{
  font-size:12px;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;
  background:#151c2d;
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.popup-icon{
  font-size:65px;
  margin-bottom:10px;
}

.popup h2{
  font-size:25px;
  margin-bottom:8px;
}

.popup p{
  color:#aab4ca;
  line-height:1.5;
  font-size:14px;
  margin-bottom:18px;
}

.popup button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  background:#fff;
  color:#111;
  font-weight:bold;
  margin-top:8px;
}

.popup .secondary{
  background:rgba(255,255,255,.08);
  color:#fff;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* POUR ANIMATION */

.tube-wrap.pouring{
  animation:pour .45s ease;
}

@keyframes pour{
  0%{transform:rotate(0)}
  50%{transform:rotate(10deg) translateY(-5px)}
  100%{transform:rotate(0)}
}

/* MOBILE */

@media(max-width:380px){

  .board{
    gap:20px 12px;
  }

  .tube-wrap{
    width:61px;
  }

  .tube{
    width:54px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- GAME SCREEN -->

  <section id="gameScreen" class="game-screen">

    <div class="top">

      <div class="logo">
        💧 Color Water 3D
      </div>

      <div class="top-right">

        <button
          class="sound-btn"
          id="soundButton"
          onclick="toggleSound()">
          🔊
        </button>

        <div class="coin-box">
          🪙 <span id="coins">0</span>
        </div>

      </div>

    </div>


    <div class="level-header">

      <div class="level-name">
        Level <span id="levelNumber">1</span>
      </div>

      <div class="moves">
        Moves: <strong id="moveCount">0</strong>
      </div>

    </div>


    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>


    <div
      class="board"
      id="board">
    </div>


    <div class="controls">

      <button
        class="control"
        onclick="undoMove()">
        ↩️ Undo
      </button>

      <button
        class="control"
        onclick="showHint()">
        💡 Hint
      </button>

      <button
        class="control"
        onclick="resetCurrentLevel()">
        🔄 Reset
      </button>

    </div>


    <button
      class="level-button"
      onclick="openLevels()">

      📋 Level Select

    </button>


    <div class="instructions">
      Tap a tube, then tap another tube to pour.<br>
      Match colors or pour into an empty tube.
    </div>

  </section>


  <!-- LEVEL SCREEN -->

  <section
    id="levelScreen"
    class="level-screen">

    <div class="level-top">

      <button
        class="back"
        onclick="closeLevels()">

        ← Back

      </button>

      <h2>Levels</h2>

    </div>

    <div
      class="level-grid"
      id="levelGrid">
    </div>

  </section>

</div>


<!-- WIN -->

<div
  class="overlay"
  id="winOverlay">

  <div class="popup">

    <div class="popup-icon">
      🎉
    </div>

    <h2>Level Complete!</h2>

    <p id="winText">
      Great job!
    </p>

    <button onclick="nextLevel()">
      ➡️ Next Level
    </button>

    <button
      class="secondary"
      onclick="closeWinAndLevels()">

      📋 Level Select

    </button>

  </div>

</div>


<!-- LOCKED -->

<div
  class="overlay"
  id="lockedOverlay">

  <div class="popup">

    <div class="popup-icon">
      🔒
    </div>

    <h2>Level Locked</h2>

    <p>
      Complete the previous level to unlock this one.
    </p>

    <button onclick="closeLocked()">
      Okay
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================================
   GAME SETTINGS
========================================= */

const MAX_LEVEL = 100;

const COLORS = [
  "red",
  "blue",
  "green",
  "yellow",
  "purple",
  "orange",
  "pink",
  "cyan"
];


/* =========================================
   SAVED PROGRESS
========================================= */

let currentLevel =
  Number(localStorage.getItem("cws_current_level")) || 1;

let unlockedLevel =
  Number(localStorage.getItem("cws_unlocked_level")) || 1;

let coins =
  Number(localStorage.getItem("cws_coins")) || 0;

let soundOn =
  localStorage.getItem("cws_sound") !== "off";

let starsData =
  JSON.parse(
    localStorage.getItem("cws_stars") || "{}"
  );


/*
  Safety check.
*/

if(currentLevel > unlockedLevel){
  currentLevel = unlockedLevel;
}


/* =========================================
   CURRENT GAME
========================================= */

let tubes = [];

let originalTubes = [];

let history = [];

let selectedTube = null;

let moves = 0;

let hintTimer = null;


/* =========================================
   AUDIO
========================================= */

let audioContext = null;


function getAudio(){

  if(!soundOn) return null;

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx) return null;

    audioContext = new AudioCtx();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;
}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.05
){

  const ctx = getAudio();

  if(!ctx) return;

  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  oscillator.type = type;

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    volume,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime + duration
  );

  oscillator.connect(gain);

  gain.connect(ctx.destination);

  oscillator.start();

  oscillator.stop(
    ctx.currentTime + duration
  );

}


function selectSound(){
  beep(520,.08,"sine",.04);
}


function pourSound(){

  beep(300,.12,"triangle",.045);

  setTimeout(
    () => beep(420,.14,"triangle",.04),
    80
  );

}


function invalidSound(){

  beep(120,.15,"square",.035);

}


function winSound(){

  beep(523,.12,"sine",.05);

  setTimeout(
    () => beep(659,.12,"sine",.05),
    120
  );

  setTimeout(
    () => beep(784,.22,"sine",.05),
    240
  );

}


function lockedSound(){

  beep(130,.15,"square",.03);

}


/* =========================================
   SOUND TOGGLE
========================================= */

function toggleSound(){

  soundOn = !soundOn;

  localStorage.setItem(
    "cws_sound",
    soundOn ? "on" : "off"
  );

  updateSoundButton();

  if(soundOn){
    beep(600,.1);
  }

}


function updateSoundButton(){

  document.getElementById(
    "soundButton"
  ).textContent =
    soundOn ? "🔊" : "🔇";

}


/* =========================================
   SAVE
========================================= */

function save(){

  localStorage.setItem(
    "cws_current_level",
    currentLevel
  );

  localStorage.setItem(
    "cws_unlocked_level",
    unlockedLevel
  );

  localStorage.setItem(
    "cws_coins",
    coins
  );

  localStorage.setItem(
    "cws_sound",
    soundOn ? "on" : "off"
  );

  localStorage.setItem(
    "cws_stars",
    JSON.stringify(starsData)
  );

}


/* =========================================
   LEVEL GENERATOR
========================================= */

function generateLevel(level){

  /*
    Difficulty increases gradually.

    Level 1-5: 3 colors
    Level 6-10: 4 colors
    Level 11-20: 5 colors
    Level 21-35: 6 colors
    Level 36+: 7-8 colors
  */

  let colorCount;

  if(level <= 5){
    colorCount = 3;
  }
  else if(level <= 10){
    colorCount = 4;
  }
  else if(level <= 20){
    colorCount = 5;
  }
  else if(level <= 35){
    colorCount = 6;
  }
  else if(level <= 60){
    colorCount = 7;
  }
  else{
    colorCount = 8;
  }

  const colors =
    COLORS.slice(0,colorCount);

  let pieces = [];

  colors.forEach(color => {

    for(let i=0;i<4;i++){
      pieces.push(color);
    }

  });


  /*
    Deterministic-ish shuffle based on level.
  */

  for(let i=pieces.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [pieces[i],pieces[j]] =
      [pieces[j],pieces[i]];

  }


  let result = [];

  for(let i=0;i<colorCount;i++){

    result.push(
      pieces.slice(
        i*4,
        i*4+4
      )
    );

  }


  /*
    Two empty tubes.
  */

  result.push([]);
  result.push([]);


  return result;

}


/* =========================================
   LOAD LEVEL
========================================= */

function loadLevel(level){

  currentLevel = level;

  tubes =
    generateLevel(level);

  originalTubes =
    JSON.parse(
      JSON.stringify(tubes)
    );

  history = [];

  selectedTube = null;

  moves = 0;

  save();

  updateHeader();

  render();

}


/* =========================================
   HEADER
========================================= */

function updateHeader(){

  document.getElementById(
    "levelNumber"
  ).textContent = currentLevel;

  document.getElementById(
    "moveCount"
  ).textContent = moves;

  document.getElementById(
    "coins"
  ).textContent = coins;

  updateSoundButton();

  const progress =
    Math.min(
      100,
      ((currentLevel-1) / MAX_LEVEL) * 100
    );

  document.getElementById(
    "progress"
  ).style.width =
    progress + "%";

}


/* =========================================
   RENDER TUBES
========================================= */

function render(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  tubes.forEach(
    (tube,index) => {

      const wrap =
        document.createElement("div");

      wrap.className =
        "tube-wrap";

      if(selectedTube === index){
        wrap.classList.add("selected");
      }

      wrap.dataset.index = index;


      const tubeElement =
        document.createElement("div");

      tubeElement.className = "tube";


      tube.forEach(color => {

        const water =
          document.createElement("div");

        water.className =
          "water " + color;

        tubeElement.appendChild(water);

      });


      wrap.appendChild(tubeElement);

      wrap.addEventListener(
        "click",
        () => selectTube(index)
      );


      board.appendChild(wrap);

    }
  );

  updateHeader();

}


/* =========================================
   SELECT TUBE
========================================= */

function selectTube(index){

  clearHint();

  const tube =
    tubes[index];


  /*
    First selection.
  */

  if(selectedTube === null){

    if(tube.length === 0){

      invalidSound();

      showToast(
        "Choose a tube with water."
      );

      return;

    }

    selectedTube = index;

    selectSound();

    render();

    return;

  }


  /*
    Tapping same tube deselects.
  */

  if(selectedTube === index){

    selectedTube = null;

    render();

    return;

  }


  /*
    Try pouring.
  */

  tryPour(
    selectedTube,
    index
  );

}


/* =========================================
   POUR
========================================= */

function tryPour(from,to){

  const source =
    tubes[from];

  const target =
    tubes[to];


  if(source.length === 0){

    selectedTube = null;

    render();

    return;

  }


  if(target.length >= 4){

    invalidSound();

    showToast(
      "That tube is full."
    );

    selectedTube = null;

    render();

    return;

  }


  const color =
    source[source.length-1];


  if(
    target.length > 0 &&
    target[target.length-1] !== color
  ){

    invalidSound();

    showToast(
      "Only matching colors can mix."
    );

    selectedTube = null;

    render();

    return;

  }


  /*
    Save state for Undo.
  */

  history.push(
    JSON.parse(
      JSON.stringify(tubes)
    )
  );


  /*
    Count matching top pieces.
  */

  let amount = 0;

  for(
    let i=source.length-1;
    i>=0;
    i--
  ){

    if(source[i] === color){
      amount++;
    }
    else{
      break;
    }

  }


  const space =
    4 - target.length;

  amount =
    Math.min(
      amount,
      space
    );


  for(let i=0;i<amount;i++){

    target.push(
      source.pop()
    );

  }


  moves++;

  selectedTube = null;

  pourSound();

  animatePour(
    from,
    to
  );

  render();


  if(checkWin()){

    setTimeout(
      completeLevel,
      450
    );

  }

}


/* =========================================
   POUR ANIMATION
========================================= */

function animatePour(from,to){

  const elements =
    document.querySelectorAll(
      ".tube-wrap"
    );

  if(elements[from]){
    elements[from].classList.add(
      "pouring"
    );
  }

  setTimeout(() => {

    if(elements[from]){
      elements[from].classList.remove(
        "pouring"
      );
    }

  },500);

}


/* =========================================
   CHECK WIN
========================================= */

function checkWin(){

  return tubes.every(tube => {

    if(tube.length === 0)
      return true;

    if(tube.length !== 4)
      return false;

    return tube.every(
      color => color === tube[0]
    );

  });

}


/* =========================================
   COMPLETE
========================================= */

function completeLevel(){

  if(starsData[currentLevel])
    return;

  let stars = 3;

  const colorCount =
    tubes.filter(
      t => t.length
