<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d1c">
<title>Color Water Sort 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#263b68 0%,#11182c 38%,#060914 100%);
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:15px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.stats{
  display:flex;
  gap:7px;
  align-items:center;
}

.stat{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  padding:9px 11px;
  font-size:13px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  background:rgba(255,255,255,.09);
  color:white;
}

/* LEVEL */

.level-row{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:9px;
}

.level{
  font-size:26px;
  font-weight:900;
}

.moves{
  color:#aeb8d0;
  font-size:13px;
}

.progress-bg{
  height:6px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress{
  height:100%;
  background:white;
  width:0;
  transition:.3s;
}

/* GAME */

.game{
  min-height:465px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px 12px;
  justify-items:center;
  align-items:end;
  padding:20px 3px;
}

/* BOTTLE */

.bottle-box{
  width:75px;
  height:210px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  position:relative;
  cursor:pointer;
  transition:.2s;
}

.bottle-box.selected{
  transform:translateY(-13px);
}

.bottle-box.hint{
  animation:pulse .65s infinite alternate;
}

@keyframes pulse{
  from{
    filter:brightness(1);
  }
  to{
    filter:brightness(1.8);
  }
}

.bottle{
  width:61px;
  height:190px;
  position:relative;
  border:2px solid rgba(255,255,255,.62);
  border-radius:29px 29px 20px 20px;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.24),
      rgba(255,255,255,.04) 24%,
      rgba(255,255,255,.10) 50%,
      rgba(0,0,0,.10) 78%,
      rgba(255,255,255,.20)
    );

  box-shadow:
    inset 6px 0 10px rgba(255,255,255,.12),
    inset -8px 0 12px rgba(0,0,0,.24),
    0 15px 25px rgba(0,0,0,.45);
}

.bottle::before{
  content:"";
  position:absolute;
  top:8px;
  bottom:10px;
  left:8px;
  width:5px;
  border-radius:10px;
  background:rgba(255,255,255,.28);
  z-index:10;
  pointer-events:none;
}

.bottle::after{
  content:"";
  position:absolute;
  left:5px;
  right:5px;
  top:-5px;
  height:10px;
  border:2px solid rgba(255,255,255,.62);
  border-radius:50%;
  background:rgba(255,255,255,.08);
  z-index:20;
}

/* WATER */

.water{
  width:100%;
  height:25%;
  flex-shrink:0;
  position:relative;
  border-top:1px solid rgba(255,255,255,.35);
  animation:waterAppear .18s ease;
}

.water:first-child{
  border-radius:0 0 18px 18px;
}

.water::before{
  content:"";
  position:absolute;
  left:-10%;
  width:120%;
  top:-4px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  animation:wave 1.3s ease-in-out infinite;
}

@keyframes wave{
  0%,100%{transform:translateX(-3%)}
  50%{transform:translateX(3%)}
}

@keyframes waterAppear{
  from{transform:scaleY(.2);transform-origin:bottom}
  to{transform:scaleY(1);transform-origin:bottom}
}

/* COLORS */

.red{
  background:linear-gradient(90deg,#9b1829,#ff5264,#b61f33);
}

.blue{
  background:linear-gradient(90deg,#1260a8,#4db7ff,#1975be);
}

.green{
  background:linear-gradient(90deg,#137846,#52df8a,#149456);
}

.yellow{
  background:linear-gradient(90deg,#b07c05,#ffe34c,#d19f08);
}

.purple{
  background:linear-gradient(90deg,#60249d,#c06aff,#7932c1);
}

.orange{
  background:linear-gradient(90deg,#b85009,#ff9b3d,#d66a12);
}

.pink{
  background:linear-gradient(90deg,#ae2868,#ff70b0,#c9367d);
}

.cyan{
  background:linear-gradient(90deg,#087d8b,#55e8ef,#109ba7);
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.control{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.09);
  color:white;
  padding:13px 5px;
  border-radius:14px;
  font-weight:bold;
}

.control:active,
.level-select:active,
.popup button:active{
  transform:scale(.97);
}

.level-select{
  width:100%;
  margin-top:11px;
  padding:14px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  background:rgba(255,255,255,.09);
  color:white;
  font-weight:bold;
}

.tip{
  color:#8994ad;
  text-align:center;
  font-size:12px;
  line-height:1.5;
  margin-top:14px;
}

/* LEVEL SCREEN */

.level-screen{
  display:none;
}

.level-screen.active{
  display:block;
}

.game-screen.hidden{
  display:none;
}

.level-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.back{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:rgba(255,255,255,.09);
  color:white;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.level-card{
  min-height:75px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  background:rgba(255,255,255,.07);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.level-card.locked{
  opacity:.3;
}

.level-card.current{
  border-color:white;
}

.number{
  font-size:20px;
  font-weight:900;
}

.small-stars{
  font-size:11px;
  margin-top:4px;
}

/* POPUPS */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(7px);
  z-index:100;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;
  background:#151d31;
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:27px 21px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.popup-icon{
  font-size:60px;
  margin-bottom:8px;
}

.popup h2{
  margin-bottom:9px;
}

.popup p{
  color:#aeb8cd;
  font-size:14px;
  line-height:1.5;
  margin-bottom:15px;
}

.popup button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background:white;
  color:#111;
  font-weight:bold;
}

.popup .secondary{
  background:rgba(255,255,255,.09);
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:white;
  color:#111;
  padding:11px 17px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* POUR */

.bottle-box.pouring{
  animation:pour .5s ease;
}

@keyframes pour{
  0%{transform:rotate(0)}
  50%{transform:rotate(12deg) translateY(-7px)}
  100%{transform:rotate(0)}
}

@media(max-width:390px){

  .board{
    gap:25px 7px;
  }

  .bottle-box{
    width:67px;
  }

  .bottle{
    width:56px;
  }

}
</style>
</head>

<body>

<div class="app">

<section id="gameScreen">

  <div class="header">

    <div class="logo">
      💧 Color Water 3D
    </div>

    <div class="stats">

      <button
        class="icon-btn"
        id="soundBtn"
        onclick="toggleSound()">
        🔊
      </button>

      <div class="stat">
        🪙 <span id="coins">0</span>
      </div>

    </div>

  </div>


  <div class="level-row">

    <div class="level">
      Level <span id="level">1</span>
    </div>

    <div class="moves">
      Moves: <b id="moves">0</b>
    </div>

  </div>


  <div class="progress-bg">
    <div
      class="progress"
      id="progress">
    </div>
  </div>


  <div class="game">

    <div
      class="board"
      id="board">
    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      onclick="undo()">
      ↩️ Undo
    </button>

    <button
      class="control"
      onclick="hint()">
      💡 Hint
    </button>

    <button
      class="control"
      onclick="resetLevel()">
      🔄 Reset
    </button>

  </div>


  <button
    class="level-select"
    onclick="openLevels()">

    📋 Choose Level

  </button>


  <div class="tip">
    Tap a bottle, then tap another bottle to pour.<br>
    Match colors or pour into an empty bottle.
  </div>

</section>


<section
  id="levelScreen"
  class="level-screen">

  <div class="level-header">

    <button
      class="back"
      onclick="closeLevels()">
      ← Back
    </button>

    <h2>Levels</h2>

  </div>

  <div
    class="level-grid"
    id="levelGrid">
  </div>

</section>

</div>


<!-- WIN -->

<div
  class="overlay"
  id="win">

  <div class="popup">

    <div class="popup-icon">
      🎉
    </div>

    <h2>Level Complete!</h2>

    <p id="winMessage"></p>

    <button onclick="nextLevel()">
      ➡️ Next Level
    </button>

    <button
      class="secondary"
      onclick="showLevelSelect()">

      📋 Level Select

    </button>

  </div>

</div>


<!-- LOCKED -->

<div
  class="overlay"
  id="locked">

  <div class="popup">

    <div class="popup-icon">
      🔒
    </div>

    <h2>Level Locked</h2>

    <p>
      Complete the previous level first.
    </p>

    <button onclick="closeLocked()">
      Okay
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* ==================================================
   SETTINGS
================================================== */

const CAPACITY = 4;

const COLORS = [
  "red",
  "blue",
  "green",
  "yellow",
  "purple",
  "orange",
  "pink",
  "cyan"
];

const MAX_LEVEL = 100;


/* ==================================================
   SAVE DATA
================================================== */

let currentLevel =
  Number(localStorage.getItem(
    "water_current_level"
  )) || 1;

let unlockedLevel =
  Number(localStorage.getItem(
    "water_unlocked_level"
  )) || 1;

let coins =
  Number(localStorage.getItem(
    "water_coins"
  )) || 0;

let soundOn =
  localStorage.getItem(
    "water_sound"
  ) !== "off";

let stars =
  JSON.parse(
    localStorage.getItem(
      "water_stars"
    ) || "{}"
  );


if(currentLevel > unlockedLevel){
  currentLevel = unlockedLevel;
}


/* ==================================================
   GAME VARIABLES
================================================== */

let bottles = [];

let startingBottles = [];

let history = [];

let selected = null;

let moveCount = 0;

let hintTimeout;


/* ==================================================
   AUDIO
================================================== */

let audio = null;


function getAudio(){

  if(!soundOn) return null;

  if(!audio){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return null;

    audio =
      new AudioContext();

  }

  if(audio.state === "suspended"){
    audio.resume();
  }

  return audio;

}


function sound(
  frequency,
  duration,
  type="sine"
){

  const ctx = getAudio();

  if(!ctx) return;

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type = type;

  osc.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    .045,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime + duration
  );

  osc.connect(gain);

  gain.connect(ctx.destination);

  osc.start();

  osc.stop(
    ctx.currentTime + duration
  );

}


function selectSound(){
  sound(550,.08);
}


function pourSound(){

  sound(280,.12,"triangle");

  setTimeout(
    () => sound(400,.14,"triangle"),
    80
  );

}


function badSound(){
  sound(130,.16,"square");
}


function winSound(){

  sound(523,.12);

  setTimeout(
    () => sound(659,.12),
    120
  );

  setTimeout(
    () => sound(784,.22),
    240
  );

}


/* ==================================================
   SOUND BUTTON
================================================== */

function toggleSound(){

  soundOn = !soundOn;

  localStorage.setItem(
    "water_sound",
    soundOn ? "on" : "off"
  );

  updateSoundButton();

  if(soundOn){
    sound(600,.1);
  }

}


function updateSoundButton(){

  document.getElementById(
    "soundBtn"
  ).textContent =
    soundOn ? "🔊" : "🔇";

}


/* ==================================================
   SAVE
================================================== */

function save(){

  localStorage.setItem(
    "water_current_level",
    currentLevel
  );

  localStorage.setItem(
    "water_unlocked_level",
    unlockedLevel
  );

  localStorage.setItem(
    "water_coins",
    coins
  );

  localStorage.setItem(
    "water_sound",
    soundOn ? "on" : "off"
  );

  localStorage.setItem(
    "water_stars",
    JSON.stringify(stars)
  );

}


/* ==================================================
   GUARANTEED-SOLVABLE LEVELS
================================================== */

/*
  Instead of randomly scrambling a puzzle,
  we START from solved bottles and perform
  legal reverse moves.

  Every generated puzzle therefore has a
  valid solution.
*/

function createSolvedState(colorCount){

  let result = [];

  for(
    let c=0;
    c<colorCount;
    c++
  ){

    result.push([
      COLORS[c],
      COLORS[c],
      COLORS[c],
      COLORS[c]
    ]);

  }

  result.push([]);
  result.push([]);

  return result;

}


function legalMoves(state){

  const moves = [];

  for(
    let from=0;
    from<state.length;
    from++
  ){

    if(state[from].length === 0)
      continue;

    const color =
      state[from][
        state[from].length-1
      ];

    let amount = 0;

    for(
      let i=state[from].length-1;
      i>=0;
      i--
    ){

      if(state[from][i] === color)
        amount++;
      else
        break;

    }


    for(
      let to=0;
      to<state.length;
      to++
    ){

      if(from === to)
        continue;

      if(state[to].length >= CAPACITY)
        continue;

      if(
        state[to].length === 0 ||
        state[to][state[to].length-1] === color
      ){

        moves.push({
          from,
          to,
          amount
        });

      }

    }

  }

  return moves;

}


function reverseMove(state,move){

  /*
    To scramble while preserving
    solvability, we move the top pieces
    in the opposite direction.
  */

  const from =
    state[move.from];

  const to =
    state[move.to];

  if(
    from.length === 0 ||
    to.length >= CAPACITY
  ){
    return false;
  }

  const color =
    from[from.length-1];

  let amount = 1;

  /*
    Move only part of a stack when possible.
  */

  if(
    from.length > 1 &&
    Math.random() > .45
  ){

    amount =
      Math.min(
        move.amount,
        CAPACITY - to.length
      );

  }

  for(let i=0;i<amount;i++){

    to.push(
      from.pop()
    );

  }

  return true;

}


function generatePuzzle(level){

  let colorCount;

  if(level <= 5)
    colorCount = 3;
  else if(level <= 12)
    colorCount = 4;
  else if(level <= 22)
    colorCount = 5;
  else if(level <= 38)
    colorCount = 6;
  else if(level <= 60)
    colorCount = 7;
  else
    colorCount = 8;


  let state =
    createSolvedState(
      colorCount
    );


  /*
    More scrambling as level increases.
  */

  const scrambleCount =
    Math.min(
      10 + level * 2,
      100
    );


  let previous = null;


  for(
    let i=0;
    i<scrambleCount;
    i++
  ){

    const possible =
      legalMoves(state)
      .filter(move => {

        /*
          Avoid immediately undoing
          the previous move.
        */

        if(
          previous &&
          move.from === previous.to &&
          move.to === previous.from
        ){
          return false;
        }

        return true;

      });


    if(possible.length === 0)
      break;


    const move =
      possible[
        Math.floor(
          Math.random() *
          possible.length
        )
      ];


    reverseMove(
      state,
      move
    );


    previous = move;

  }


  return state;

}


/* ==================================================
   LOAD
================================================== */

function loadLevel(level){

  currentLevel = level;

  bottles =
    generatePuzzle(level);

  startingBottles =
    JSON.parse(
      JSON.stringify(bottles)
    );

  history = [];

  selected = null;

  moveCount = 0;

  save();

  render();

}


/* ==================================================
   RENDER
================================================== */

function render(){

  const board =
    document.getElementById(
      "board"
    );

  board.innerHTML = "";


  bottles.forEach(
    (water,index) => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "bottle-box";


      if(selected === index){

        wrapper.classList.add(
          "selected"
        );

      }


      wrapper.addEventListener(
        "click",
        () => tapBottle(index)
      );


      const bottle =
        document.createElement(
          "div"
        );

      bottle.className =
        "bottle";


      /*
        Water is rendered bottom-up.
      */

      water.forEach(color => {

        const segment =
          document.createElement(
            "div"
          );

        segment.className =
          "water " + color;

        bottle.appendChild(
          segment
        );

      });


      wrapper.appendChild(
        bottle
      );

      board.appendChild(
        wrapper
      );

    }
  );


  updateUI();

}


/* ==================================================
   UI
================================================== */

function updateUI(){

  document.getElementById(
    "level"
  ).textContent =
    currentLevel;

  document.getElementById(
    "moves"
  ).textContent =
    moveCount;

  document.getElementById(
    "coins"
  ).textContent =
    coins;

  updateSoundButton();


  const percentage =
    Math.min(
      100,
      ((currentLevel - 1) /
      MAX_LEVEL) * 100
    );

  document.getElementById(
    "progress"
  ).style.width =
    percentage + "%";

}


/* ==================================================
   TAP BOTTLE
================================================== */

function tapBottle(index){

  clearHint();

  /*
    First bottle.
  */

  if(selected === null){

    if(
      bottles[index].length === 0
    ){

      badSound();

      toast(
        "Choose a bottle with water."
      );

      return;

    }


    selected = index;

    selectSound();

    render();

    return;

  }


  /*
    Tap same bottle.
  */

  if(selected === index){

    selected = null;

    render();

    return;

  }


  pour(
    selected,
    index
  );

}


/* ==================================================
   POUR
================================================== */

function pour(fromIndex,toIndex){

  const from =
    bottles[fromIndex];

  const to =
    bottles[toIndex];


  if(from.length === 0){
    selected = null;
    render();
    return;
  }


  if(to.length >= CAPACITY){

    badSound();

    toast(
      "That bottle is full."
    );

    selected = null;

    render();

    return;

  }


  const color =
    from[from.length-1];


  if(
    to.length > 0 &&
    to[to.length-1] !== color
  ){

    badSound();

    toast(
      "Colors don't match."
    );

    selected = null;

    render();

    return;

  }


  /*
    Save state for Undo.
  */

  history.push(
    JSON.parse(
      JSON.stringify(bottles)
    )
  );


  /*
    Count same colo
