<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Parking Jam</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#26365b,#10172b 45%,#060912);
  font-family:Arial,sans-serif;
  color:white;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:16px;
  min-height:100vh;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.coins{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  padding:9px 13px;
}

/* LEVEL */

.level-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.level{
  font-size:25px;
  font-weight:900;
}

.moves{
  color:#aab5ca;
  font-size:13px;
}

.progress-bg{
  height:6px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.progress{
  height:100%;
  width:0;
  background:white;
  transition:.3s;
}

/* PARKING LOT */

.parking-wrap{
  width:100%;
  display:flex;
  justify-content:center;
}

.parking{
  position:relative;
  width:min(92vw,430px);
  aspect-ratio:1/1.25;

  background:
    linear-gradient(90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px),
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px),
    #252b36;

  background-size:25% 20%;

  border:7px solid #4d5663;
  border-radius:18px;

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.5),
    0 20px 40px rgba(0,0,0,.45);

  overflow:hidden;
}

/* PARKING LINES */

.slot{
  position:absolute;
  border:2px dashed rgba(255,255,255,.22);
  border-radius:6px;
}

/* EXIT */

.exit{
  position:absolute;
  left:0;
  top:43%;
  width:8%;
  height:14%;
  background:#36d477;
  border-radius:0 10px 10px 0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  writing-mode:vertical-rl;
  font-size:10px;
  font-weight:bold;
}

/* CAR */

.car{
  position:absolute;
  border-radius:10px;
  border:2px solid rgba(255,255,255,.6);

  box-shadow:
    0 8px 12px rgba(0,0,0,.45),
    inset 4px 0 8px rgba(255,255,255,.12);

  cursor:pointer;

  transition:
    left .38s ease,
    top .38s ease,
    transform .2s ease;

  z-index:10;
}

.car:active{
  transform:scale(.96);
}

.car::before{
  content:"";
  position:absolute;
  background:rgba(150,220,255,.75);
  border:1px solid rgba(255,255,255,.45);
  border-radius:4px;
}

.car::after{
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  background:#111;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,255,255,.15);
}

/* HORIZONTAL */

.car.horizontal{
  width:23%;
  height:12%;
}

.car.horizontal::before{
  left:22%;
  right:22%;
  top:12%;
  height:76%;
}

.car.horizontal::after{
  right:8%;
  bottom:8%;
}

/* VERTICAL */

.car.vertical{
  width:12%;
  height:23%;
}

.car.vertical::before{
  top:22%;
  bottom:22%;
  left:12%;
  width:76%;
}

.car.vertical::after{
  right:8%;
  bottom:8%;
}

/* COLORS */

.red{
  background:#e84855;
}

.blue{
  background:#3987e8;
}

.green{
  background:#3bbf78;
}

.yellow{
  background:#e9b82e;
}

.purple{
  background:#9b59d0;
}

.orange{
  background:#ed8138;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:18px;
}

.control{
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  background:rgba(255,255,255,.09);
  color:white;
  padding:13px 5px;
  font-weight:bold;
}

.level-button{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.09);
  color:white;
  font-weight:bold;
}

/* INSTRUCTIONS */

.tip{
  text-align:center;
  color:#8995ad;
  font-size:12px;
  line-height:1.5;
  margin-top:13px;
}

/* LEVEL SELECT */

.level-screen{
  display:none;
}

.level-screen.active{
  display:block;
}

.game-screen.hidden{
  display:none;
}

.level-header{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:22px;
}

.back{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:rgba(255,255,255,.1);
  color:white;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.level-card{
  min-height:70px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:rgba(255,255,255,.07);
  color:white;
}

.level-card.locked{
  opacity:.3;
}

.level-card.current{
  border-color:white;
}

.level-number{
  font-size:19px;
  font-weight:bold;
}

.stars{
  font-size:11px;
  margin-top:4px;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(6px);
  z-index:100;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:340px;
  background:#161e31;
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:26px;
  text-align:center;
}

.popup-icon{
  font-size:55px;
}

.popup h2{
  margin:8px 0;
}

.popup p{
  color:#aab5ca;
  font-size:14px;
  line-height:1.5;
}

.popup button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:white;
  color:#111;
  font-weight:bold;
}

.popup .secondary{
  background:rgba(255,255,255,.1);
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:white;
  color:#111;
  border-radius:30px;
  padding:11px 18px;
  font-size:13px;
  font-weight:bold;
  transition:.25s;
  z-index:200;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app">

<!-- GAME -->

<section id="gameScreen">

  <div class="header">

    <div class="logo">
      🚗 Parking Jam
    </div>

    <div class="coins">
      🪙 <span id="coins">0</span>
    </div>

  </div>


  <div class="level-row">

    <div class="level">
      Level <span id="level">1</span>
    </div>

    <div class="moves">
      Moves: <b id="moves">0</b>
    </div>

  </div>


  <div class="progress-bg">
    <div
      class="progress"
      id="progress">
    </div>
  </div>


  <div class="parking-wrap">

    <div
      class="parking"
      id="parking">

      <div class="exit">
        EXIT
      </div>

    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      onclick="undo()">
      ↩️ Undo
    </button>

    <button
      class="control"
      onclick="hint()">
      💡 Hint
    </button>

    <button
      class="control"
      onclick="resetLevel()">
      🔄 Reset
    </button>

  </div>


  <button
    class="level-button"
    onclick="openLevels()">

    📋 Choose Level

  </button>


  <div class="tip">
    Tap a car to move it toward the exit.<br>
    Clear the path and get every car out.
  </div>

</section>


<!-- LEVEL SELECT -->

<section
  id="levelScreen"
  class="level-screen">

  <div class="level-header">

    <button
      class="back"
      onclick="closeLevels()">
      ← Back
    </button>

    <h2>Levels</h2>

  </div>

  <div
    class="level-grid"
    id="levelGrid">
  </div>

</section>

</div>


<!-- WIN POPUP -->

<div
  class="overlay"
  id="winPopup">

  <div class="popup">

    <div class="popup-icon">
      🎉
    </div>

    <h2>Parking Cleared!</h2>

    <p id="winText"></p>

    <button onclick="nextLevel()">
      🚗 Next Level
    </button>

    <button
      class="secondary"
      onclick="showLevels()">

      📋 Level Select

    </button>

  </div>

</div>


<!-- LOCKED POPUP -->

<div
  class="overlay"
  id="lockedPopup">

  <div class="popup">

    <div class="popup-icon">
      🔒
    </div>

    <h2>Level Locked</h2>

    <p>
      Complete the previous level first.
    </p>

    <button onclick="closeLocked()">
      Okay
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* ==========================================
   GAME SETTINGS
========================================== */

const MAX_LEVEL = 50;


/* ==========================================
   SAVE DATA
========================================== */

let currentLevel =
  Number(
    localStorage.getItem(
      "parking_level"
    )
  ) || 1;


let unlockedLevel =
  Number(
    localStorage.getItem(
      "parking_unlocked"
    )
  ) || 1;


let coins =
  Number(
    localStorage.getItem(
      "parking_coins"
    )
  ) || 0;


let bestStars =
  JSON.parse(
    localStorage.getItem(
      "parking_stars"
    ) || "{}"
  );


/* ==========================================
   GAME VARIABLES
========================================== */

let cars = [];

let originalCars = [];

let history = [];

let moves = 0;

let hintTimer;


/* ==========================================
   LEVEL GENERATOR
========================================== */

/*
  The game uses handcrafted layouts.

  This makes the prototype predictable
  and prevents impossible random levels.
*/

const LEVELS = [

  /* LEVEL 1 */

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:18,
      y:44
    },
    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:45,
      y:15
    },
    {
      id:3,
      color:"yellow",
      dir:"vertical",
      x:70,
      y:28
    }
  ],


  /* LEVEL 2 */

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:25,
      y:44
    },
    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:50,
      y:15
    },
    {
      id:3,
      color:"green",
      dir:"vertical",
      x:75,
      y:20
    },
    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:8,
      y:65
    }
  ],


  /* LEVEL 3 */

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:18,
      y:44
    },
    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:43,
      y:18
    },
    {
      id:3,
      color:"green",
      dir:"vertical",
      x:68,
      y:12
    },
    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:10,
      y:68
    },
    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:78,
      y:62
    }
  ],


  /* LEVEL 4 */

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:22,
      y:44
    },
    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:48,
      y:8
    },
    {
      id:3,
      color:"green",
      dir:"vertical",
      x:72,
      y:12
    },
    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:7,
      y:67
    },
    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:60,
      y:63
    },
    {
      id:6,
      color:"orange",
      dir:"horizontal",
      x:36,
      y:78
    }
  ],


  /* LEVEL 5 */

  [
    {
      id:1,
      color:"red",
      dir:"horizontal",
      x:20,
      y:44
    },
    {
      id:2,
      color:"blue",
      dir:"vertical",
      x:42,
      y:8
    },
    {
      id:3,
      color:"green",
      dir:"vertical",
      x:65,
      y:15
    },
    {
      id:4,
      color:"yellow",
      dir:"horizontal",
      x:5,
      y:68
    },
    {
      id:5,
      color:"purple",
      dir:"vertical",
      x:55,
      y:62
    },
    {
      id:6,
      color:"orange",
      dir:"horizontal",
      x:30,
      y:80
    },
    {
      id:7,
      color:"blue",
      dir:"horizontal",
      x:68,
      y:80
    }
  ]

];


/* ==========================================
   LOAD LEVEL
========================================== */

function loadLevel(level){

  currentLevel = level;

  /*
    For levels beyond the handcrafted
    prototypes, reuse and slightly
    expand the final layout.
  */

  let source =
    LEVELS[
      Math.min(
        level - 1,
        LEVELS.length - 1
      )
    ];


  cars =
    JSON.parse(
      JSON.stringify(source)
    );


  /*
    Add more cars for higher levels.
  */

  if(level > 5){

    const extra =
      Math.min(
        level - 5,
        5
      );


    const colors = [
      "red",
      "blue",
      "green",
      "yellow",
      "purple",
      "orange"
    ];


    for(
      let i=0;
      i<extra;
      i++
    ){

      cars.push({
        id:cars.length + 1,
        color:
          colors[
            i % colors.length
          ],
        dir:
          i % 2 === 0
            ? "vertical"
            : "horizontal",
        x:
          10 + (i * 16) % 80,
        y:
          10 + (i * 13) % 80
      });

    }

  }


  originalCars =
    JSON.parse(
      JSON.stringify(cars)
    );


  history = [];

  moves = 0;

  save();

  render();

}


/* ==========================================
   RENDER
========================================== */

function render(){

  const parking =
    document.getElementById(
      "parking"
    );


  /*
    Remove old cars.
  */

  parking
    .querySelectorAll(
      ".car"
    )
    .forEach(
      car =>
        car.remove()
    );


  cars.forEach(
    car => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "car " +
        car.color +
        " " +
        car.dir;


      element.dataset.id =
        car.id;


      element.style.left =
        car.x + "%";


      element.style.top =
        car.y + "%";


      element.onclick =
        () =>
          moveCar(car.id);


      parking.appendChild(
        element
      );

    }
  );


  updateUI();

}


/* ==========================================
   MOVE CAR
========================================== */

function moveCar(id){

  const car =
    cars.find(
      c => c.id === id
    );


  if(!car)
    return;


  /*
    Save state.
  */

  history.push(
    JSON.parse(
      JSON.stringify(cars)
    )
  );


  /*
    Store old position.
  */

  const oldCars =
    JSON.parse(
      JSON.stringify(cars)
    );


  /*
    Cars move toward the exit.

    Horizontal cars move left.
    Vertical cars move downward.

    If the path is blocked, they move
    only when another car is cleared.
  */

  if(car.dir === "horizontal"){

    const blocked =
      cars.some(
        other =>
          other.id !== car.id &&
          Math.abs(
            other.y - car.y
          ) < 10 &&
          other.x < car.x &&
          other.x > 3
      );


    if(blocked){

      history.pop();

      toast(
        "🚧 Another car is blocking the way."
      );

      return;

    }


    car.x = -25;

  }else{

    const blocked =
      cars.some(
        other =>
          other.id !== car.id &&
          Math.abs(
            other.x - car.x
          ) < 10 &&
          other.y > car.y &&
          other.y < 90
      );


    if(blocked){

      history.pop();

      toast(
        "🚧 Another car is blocking the way."
      );

      return;

    }


    car.y = 115;

  }


  moves++;

  render();


  /*
    Remove cars that have exited.
  */

  setTimeout(
    () => {

      cars =
        cars.filter(
          c =>
            c.x > -20 &&
            c.y < 110
        );


      render();


      if(
        cars.length === 0
      ){

        completeLevel();

      }

    },
    400
  );

}


/* ==========================================
   UNDO
========================================== */

function undo(){

  if(
    history.length === 0
  ){

    toast(
      "Nothing to undo."
    );

    return;

  }


  cars =
    history.pop();

  moves =
    Math.max(
      0,
      moves - 1
    );

  render();

}


/* ==========================================
   RESET
========================================== */

function resetLevel(){

  cars =
    JSON.parse(
      JSON.stringify(
        originalCars
      )
    );

  history = [];

  moves = 0;

  render();

  toast(
    "Level " +
    currentLevel +
    " restarted."
  );

}


/* ==========================================
   HINT
========================================== */

function hint(){

  clearHint();


  if(cars.length === 0)
    return;


  const first =
    document.querySelector(
      `.car[data-id="${cars[0].id}"]`
    );


  if(first){

    first.style.boxShadow =
      "0 0 25px 8px white";


    hintTimer =
      setTimeout(
        clearHint,
        2500
      );


    toast(
      "💡 Try this car first."
    );

  }

}


function clearHint(){

  if(hintTimer){

    clearTimeout(
      hintTimer
    );

    hintTimer = null;

  }


  document
    .querySelectorAll(
      ".car"
    )
    .forEach(
      car =>
        car.style.boxShadow = ""
    );

}


/* ==========================================
   COMPLETE LEVEL
========================================== */

function completeLevel(){

  if(
    bestStars[currentLevel]
  )
    return;


  let rating = 3;


  if(
    moves > cars.length * 3
  )
    rating = 2;


  if(
    moves > cars.length * 5
  )
    rating = 1;


  bestStars[currentLevel] =
    rating;


  if(
    currentLevel === unlockedLevel &&
    currentLevel < MAX_LEVEL
  ){

    unlockedLevel =
      currentLevel + 1;

  }


  const reward =
    10 + rating * 5;


  coins += reward;

  save();


  document.getElementById(
    "winText"
  ).textContent =
    "⭐".repeat(rating) +
    "  Completed in " +
    moves +
    " moves. +" +
    reward +
    " coins";


  document
    .getElementById(
      "winPopup"
    )
    .classList.add(
      "show"
    );

}


/* ==========================================
   NEXT LEVEL
========================================== */

function nextLevel(){

  document
    .getElementById(
      "winPopup"
    )
    .classList.remove(
      "show"
    );


  if(
    currentLevel < unlockedLevel
  ){

    loadLevel(
      currentLevel + 1
    );

  }

}


/* ==========================================
   LEVEL SELECT
========================================== */

function openLevels(){

  document
    .getElementById(
      "gameScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "levelScreen"
    )
    .classList.add(
      "active"
    );


  renderLevels();

}


function closeLevels(){

  document
    .getElementById(
      "levelScreen"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "gameScreen"
    )
    .classList.remove(
      "hidden"
    );

}


function renderLevels(){

  const grid =
    document.getElementById(
      "levelGrid"
    );


  grid.innerHTML = "";


  for(
    let level=1;
    level<=MAX_LEVEL;
    level++
  ){

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "level-card";


    const unlocked =
      level <= unlockedLevel;


    if(!unlocked){

      button.classList.add(
        "locked"
      );

    }


    if(
      level === currentLevel
    ){

      button.classList.add(
        "current"
      );

    }


    const stars =
      bestStars[level]
        ? "⭐".repeat(
            bestStars[level]
          )
        : "—";


    button.innerHTML = `
      <div class="level-number">
        ${
          unlocked
            ? level
            : "🔒"
        }
      </div>

      <div class="stars">
        ${stars}
      </div>
    `;


    button.onclick =
      () => {

        if(!unlocked){

          document
            .getElementById(
              "lockedPopup"
            )
            .classList.add(
              "show"
            );

          return;

        }


        loadLevel(level);

        closeLevels();

      };


    grid.appendChild(
      button
    );

  }

}


/* ==========================================
   POPUPS
========================================== */

function s
