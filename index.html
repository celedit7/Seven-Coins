<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Request</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: #101d2c;
      border: 1px solid #273a50;
      border-radius: 22px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .live-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #1a2b3f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .welcome {
      color: #9aa9ba;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .price {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .price-label {
      color: #8d9caf;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .info {
      background: #0c1826;
      border: 1px solid #26384d;
      border-radius: 14px;
      padding: 15px;
      text-align: left;
      margin-bottom: 20px;
    }

    .info-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .info-text {
      color: #8998aa;
      font-size: 12px;
      line-height: 1.5;
    }

    .pay-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #f1c40f;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:active {
      transform: scale(.98);
    }

    #status {
      margin-top: 16px;
      color: #9aa9ba;
      font-size: 13px;
      line-height: 1.5;
    }

    .btc-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #0c1826;
      border: 1px solid #26384d;
      border-radius: 14px;
      text-align: left;
    }

    .btc-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .btc-address {
      word-break: break-all;
      color: #f1c40f;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .copy-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      background: #1b2c40;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .check-button {
      width: 100%;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #f1c40f;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .join-button {
      display: none;
      width: 100%;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #20bf6b;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .small {
      color: #66778b;
      font-size: 11px;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="card">

      <div class="live-icon">
        🔴
      </div>

      <h1>
        Live Request
      </h1>

      <p class="welcome" id="welcome">
        Request a live session.
      </p>

      <div class="price">
        $10
      </div>

      <div class="price-label">
        One live request
      </div>

      <div class="info">

        <div class="info-title">
          💳 Payment
        </div>

        <div class="info-text">
          Pay the required amount in Bitcoin.
          Your payment must be verified before
          access to the live page is provided.
        </div>

      </div>

      <button
        class="pay-button"
        id="payButton"
        onclick="showPayment()"
      >
        Pay with Bitcoin
      </button>

      <div
        class="btc-box"
        id="btcBox"
      >

        <div class="btc-title">
          ₿ Bitcoin Payment
        </div>

        <div
          class="btc-address"
          id="btcAddress"
        >
          Bitcoin address will appear here.
        </div>

        <button
          class="copy-button"
          onclick="copyAddress()"
        >
          Copy BTC Address
        </button>

        <button
          class="check-button"
          onclick="checkPayment()"
        >
          Check Payment
        </button>

      </div>

      <p id="status"></p>

      <button
        class="join-button"
        id="joinButton"
        onclick="joinLive()"
      >
        🔴 Join Live
      </button>

      <p class="small">
        Payment confirmation is required before
        live access is enabled.
      </p>

    </div>

  </div>


  <script>

    const BTC_ADDRESS =
      "bc1qlvast66gfja2rs2z77n2kmkwfyxx99klvmrkh5";

    /*
      Replace this with your GitHub Pages live-page URL
      after the live page has been created.
    */

    const LIVE_PAGE_URL =
      "https://celedit7.github.io/live-payment-app/live.html";


    function showPayment() {

      const box =
        document.getElementById("btcBox");

      const address =
        document.getElementById("btcAddress");

      const status =
        document.getElementById("status");

      box.style.display = "block";

      address.textContent =
        BTC_ADDRESS;

      status.textContent =
        "Send the required BTC amount to the address above. Payment will need to be verified.";

      document.getElementById("payButton").style.display =
        "none";

    }


    function copyAddress() {

      navigator.clipboard
        .writeText(BTC_ADDRESS)
        .then(() => {

          document.getElementById("status").textContent =
            "BTC address copied.";

        })
        .catch(() => {

          document.getElementById("status").textContent =
            "Copy failed. Please copy the address manually.";

        });

    }


    async function checkPayment() {

      const status =
        document.getElementById("status");

      status.textContent =
        "Checking payment...";

      /*
        IMPORTANT:

        This is only a placeholder.

        Real BTC verification will be connected
        to the backend later.

        Do NOT mark payment as successful here.
      */

      setTimeout(() => {

        status.textContent =
          "Payment verification is not connected yet.";

      }, 1000);

    }


    function joinLive() {

      window.location.href =
        LIVE_PAGE_URL;

    }


    function loadTelegramUser() {

      if (
        window.Telegram &&
        Telegram.WebApp
      ) {

        Telegram.WebApp.ready();

        const user =
          Telegram.WebApp.initDataUnsafe?.user;

        if (user) {

          const name =
            user.first_name || "there";

          document.getElementById("welcome").textContent =
            "Hello " + name + " 👋 Request a live session.";

        }

      }

    }


    loadTelegramUser();

  </script>

</body>
</html>
