<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Celedit Tic Tac Toe</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#263a58,#0b1018 55%,#05070a);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  padding:18px;
  text-align:center;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.badge{
  background:#182331;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

/* SCORE */

.scoreboard{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:18px;
}

.score{
  background:#121b27;
  border:1px solid #273548;
  border-radius:15px;
  padding:12px 5px;
}

.score strong{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.score span{
  color:#8997aa;
  font-size:11px;
}

/* TURN */

.turn{
  min-height:25px;
  margin-bottom:15px;
  font-size:15px;
  font-weight:800;
}

/* BOARD */

.board{
  position:relative;
  width:min(92vw,390px);
  aspect-ratio:1;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:8px;

  background:#101722;
  padding:8px;
  border-radius:25px;

  box-shadow:
    0 20px 55px rgba(0,0,0,.5);
}

.cell{
  border:0;
  border-radius:18px;
  background:#1a2533;
  color:white;

  font-size:62px;
  font-weight:900;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    transform .12s,
    background .2s;
}

.cell:active{
  transform:scale(.94);
}

.cell.x{
  color:#4da3ff;
}

.cell.o{
  color:#ff6078;
}

.cell.win{
  animation:
    winPulse .55s infinite alternate;
}

@keyframes winPulse{
  from{
    transform:scale(1);
  }
  to{
    transform:scale(1.06);
  }
}

/* CONTROLS */

.controls{
  margin-top:18px;
  display:grid;
  gap:10px;
}

button{
  font-family:inherit;
}

.control{
  border:0;
  border-radius:13px;
  padding:13px;
  background:#1b2735;
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.control:active{
  transform:scale(.97);
}

.primary{
  background:#f1c40f;
  color:#111;
}

/* MODE */

.modes{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.mode{
  flex:1;
  border:1px solid #304053;
  background:#121b27;
  color:#9eabba;
  border-radius:12px;
  padding:10px 5px;
  font-size:12px;
  font-weight:bold;
}

.mode.active{
  background:#29394d;
  color:white;
  border-color:#687b94;
}

/* DIFFICULTY */

.difficulty{
  margin-top:10px;
  display:flex;
  gap:7px;
}

.diff{
  flex:1;
  border:1px solid #304053;
  background:#121b27;
  color:#9eabba;
  border-radius:10px;
  padding:9px 3px;
  font-size:11px;
  font-weight:bold;
}

.diff.active{
  background:#27394e;
  color:white;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.82);

  padding:20px;

  z-index:20;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;

  background:#17212e;
  border:1px solid #2a394c;

  border-radius:25px;

  padding:30px 22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

.popupIcon{
  font-size:60px;
}

.popup h2{
  margin:8px 0;
  font-size:28px;
}

.popup p{
  color:#aab5c4;
  line-height:1.5;
}

.popup button{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#f1c40f;
  color:#111;
  font-weight:900;
}

.resetScore{
  margin-top:9px;
  background:#121b27;
  color:#8795a8;
}

.footer{
  margin-top:18px;
  color:#68778b;
  font-size:11px;
}

@media(max-width:380px){

  .app{
    padding:12px;
  }

  .cell{
    font-size:51px;
    border-radius:15px;
  }

  .board{
    gap:6px;
    padding:6px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      ❌⭕ Celedit
    </div>

    <div class="badge">
      TIC TAC TOE
    </div>

  </div>


  <!-- SCORE -->

  <div class="scoreboard">

    <div class="score">
      <strong id="playerScore">0</strong>
      <span id="playerLabel">YOU ❌</span>
    </div>

    <div class="score">
      <strong id="drawScore">0</strong>
      <span>DRAWS</span>
    </div>

    <div class="score">
      <strong id="computerScore">0</strong>
      <span id="computerLabel">CPU ⭕</span>
    </div>

  </div>


  <div
    class="turn"
    id="turn">
    Your turn
  </div>


  <!-- BOARD -->

  <div
    class="board"
    id="board">

    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>

    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>

    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="control primary"
      onclick="newRound()">
      🔄 New Round
    </button>

    <div class="modes">

      <button
        class="mode active"
        id="cpuMode"
        onclick="setMode('cpu')">
        🤖 VS COMPUTER
      </button>

      <button
        class="mode"
        id="friendMode"
        onclick="setMode('friend')">
        👥 TWO PLAYERS
      </button>

    </div>


    <div
      class="difficulty"
      id="difficulty">

      <button
        class="diff active"
        onclick="setDifficulty('easy')"
        id="easy">
        EASY
      </button>

      <button
        class="diff"
        onclick="setDifficulty('medium')"
        id="medium">
        MEDIUM
      </button>

      <button
        class="diff"
        onclick="setDifficulty('hard')"
        id="hard">
        HARD
      </button>

    </div>

    <button
      class="control"
      onclick="resetScores()">
      🗑 Reset Scores
    </button>

  </div>


  <div class="footer">
    Progress is automatically saved on this device.
  </div>

</div>


<!-- RESULT -->

<div
  class="overlay"
  id="overlay">

  <div class="popup">

    <div
      class="popupIcon"
      id="popupIcon">
      🏆
    </div>

    <h2 id="popupTitle">
      You Win!
    </h2>

    <p id="popupText">
      Nice move!
    </p>

    <button onclick="newRound()">
      Play Again
    </button>

  </div>

</div>


<script>

/*
==================================================
 CELEDIT TIC TAC TOE
 No Firebase
 No API
 No external libraries
==================================================
*/


/* ================================================
   ELEMENTS
================================================ */

const cells =
  document.querySelectorAll(".cell");

const turnText =
  document.getElementById("turn");

const overlay =
  document.getElementById("overlay");

const popupIcon =
  document.getElementById("popupIcon");

const popupTitle =
  document.getElementById("popupTitle");

const popupText =
  document.getElementById("popupText");


/* ================================================
   GAME DATA
================================================ */

let board = [
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  ""
];


let currentPlayer =
  "X";


let gameActive =
  true;


let mode =
  "cpu";


let difficulty =
  "easy";


let scores = {

  player:
    Number(
      localStorage.getItem(
        "tttPlayer"
      )
    ) || 0,

  computer:
    Number(
      localStorage.getItem(
        "tttComputer"
      )
    ) || 0,

  draws:
    Number(
      localStorage.getItem(
        "tttDraws"
      )
    ) || 0

};


/* ================================================
   WINNING COMBINATIONS
================================================ */

const wins = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];


/* ================================================
   SOUNDS
================================================ */

let audioContext;


function sound(
  frequency,
  duration
){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      frequency;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      .08,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime +
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(e){}

}


/* ================================================
   CLICK EVENTS
================================================ */

cells.forEach(
  cell => {

    cell.addEventListener(
      "click",
      () => {

        const index =
          Number(
            cell.dataset.index
          );


        playerMove(index);

      }
    );

  }
);


/* ================================================
   PLAYER MOVE
================================================ */

function playerMove(index){

  if(
    !gameActive ||
    board[index] !== ""
  )
    return;


  if(
    mode === "cpu" &&
    currentPlayer !== "X"
  )
    return;


  board[index] =
    currentPlayer;


  sound(
    currentPlayer === "X"
      ? 520
      : 350,
    .08
  );


  render();


  const result =
    checkGame();


  if(result)
    return;


  currentPlayer =
    currentPlayer === "X"
      ? "O"
      : "X";


  updateTurn();


  /*
    Computer turn.
  */

  if(
    mode === "cpu" &&
    currentPlayer === "O"
  ){

    setTimeout(
      computerMove,
      400
    );

  }

}


/* ================================================
   COMPUTER
================================================ */

function computerMove(){

  if(
    !gameActive ||
    mode !== "cpu"
  )
    return;


  let move;


  if(
    difficulty === "easy"
  ){

    move =
      randomMove();

  }


  else if(
    difficulty === "medium"
  ){

    /*
      60% smart,
      40% random.
    */

    if(
      Math.random() < .6
    ){

      move =
        smartMove();

    }else{

      move =
        randomMove();

    }

  }


  else{

    move =
      bestMove();

  }


  if(move === -1)
    return;


  board[move] =
    "O";


  sound(
    350,
    .08
  );


  render();


  const result =
    checkGame();


  if(result)
    return;


  currentPlayer =
    "X";


  updateTurn();

}


/* ================================================
   RANDOM MOVE
================================================ */

function randomMove(){

  const empty =
    board
      .map(
        (value,index) =>
          value === ""
            ? index
            : null
      )
      .filter(
        index =>
          index !== null
      );


  if(!empty.length)
    return -1;


  return empty[
    Math.floor(
      Math.random() *
      empty.length
    )
  ];

}


/* ================================================
   SMART MOVE
================================================ */

function smartMove(){

  /*
    Try winning.
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      "O";


    if(
      winner("O")
    ){

      board[i] =
        "";

      return i;

    }


    board[i] =
      "";

  }


  /*
    Block player.
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      "X";


    if(
      winner("X")
    ){

      board[i] =
        "";

      return i;

    }


    board[i] =
      "";

  }


  /*
    Prefer center.
  */

  if(
    board[4] === ""
  )
    return 4;


  /*
    Prefer corners.
  */

  const corners =
    [0,2,6,8]
      .filter(
        i =>
          board[i] === ""
      );


  if(corners.length){

    return corners[
      Math.floor(
        Math.random() *
        corners.length
      )
    ];

  }


  return randomMove();

}


/* ================================================
   HARD AI
   MINIMAX
================================================ */

function bestMove(){

  let bestScore =
    -Infinity;

  let move =
    -1;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      "O";


    const score =
      minimax(
        board,
        false
      );


    board[i] =
      "";


    if(
      score > bestScore
    ){

      bestScore =
        score;

      move =
        i;

    }

  }


  return move;

}


function minimax(
  position,
  maximizing
){

  if(
    winner("O")
  )
    return 10;


  if(
    winner("X")
  )
    return -10;


  if(
    position.every(
      cell =>
        cell !== ""
    )
  )
    return 0;


  if(maximizing){

    let best =
      -Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(
        position[i] !== ""
      )
        continue;


      position[i] =
        "O";


      best =
        Math.max(
          best,
          minimax(
            position,
            false
          )
        );


      position[i] =
        "";


    }


    return best;

  }


  else{

    let best =
      Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(
        position[i] !== ""
      )
        continue;


      position[i] =
        "X";


      best =
        Math.min(
          best,
          minimax(
            position,
            true
          )
        );


      position[i] =
        "";

    }


    return best;

  }

}


/* ================================================
   CHECK WINNER
================================================ */

function winner(
  symbol
){

  return wins.some(
    combo =>
      combo.every(
        index =>
          board[index] === symbol
      )
  );

}


/* ================================================
   CHECK GAME
================================================ */

function checkGame(){

  let winningCombo =
    null;


  for(
    const combo of wins
  ){

    if(
      combo.every(
        index =>
          board[index] !== "" &&
          board[index] ===
          board[combo[0]]
      )
    ){

      winningCombo =
        combo;

      break;

    }

  }


  if(winningCombo){

    gameActive =
      false;


    winningCombo.forEach(
      index =>
        cells[index]
          .classList.add(
            "win"
          )
    );


    const winnerSymbol =
      board[
        winningCombo[0]
      ];


    if(
      mode === "friend"
    ){

      if(
        winnerSymbol === "X"
      ){

        scores.player++;

      }else{

        scores.computer++;

      }

    }


    else{

      if(
        winnerSymbol === "X"
      ){

        scores.player++;

      }else{

        scores.computer++;

      }

    }


    saveScores();

    updateScores();


    sound(
      winnerSymbol === "X"
        ? 700
        : 430,
      .25
    );


    setTimeout(
      () =>
        showResult(
          winnerSymbol === "X"
            ? "X"
            : "O"
        ),
      500
    );


    return true;

  }


  /*
    Draw.
  */

  if(
    board.every(
      cell =>
        cell !== ""
    )
  ){

    gameActive =
      false;


    scores.draws++;

    saveScores();

    updateScores();


    sound(
      250,
      .2
    );


    setTimeout(
      showDraw,
      400
    );


    return true;

  }


  return false;

}


/* ================================================
   RENDER
================================================ */

function render(){

  cells.forEach(
    (cell,index) => {

      cell.textContent =
        board[index];


      cell.classList.remove(
        "x",
        "o"
      );


      if(
        board[index] === "X"
      )
        cell.classList.add(
          "x"
        );


      if(
        board[index] === "O"
      )
        cell.classList.add(
          "o"
        );

    }
  );

}


/* ================================================
   TURN
================================================ */

function updateTurn(){

  if(
    mode === "friend"
  ){

    turnText.textContent =
      currentPlayer === "X"
        ? "Player 1 — your turn ❌"
        : "Player 2 — your turn ⭕";

  }

  else{

    turnText.textContent =
      currentPlayer === "X"
        ? "Your turn ❌"
        : "Computer is thinking... 🤖";

  }

}


/* ================================================
   NEW ROUND
================================================ */

function newRound(){

  board =
    [
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      ""
    ];


  currentPlayer =
    "X";


  gameActive =
    true;


  cells.forEach(
    cell =>
      cell.classList.remove(
        "win"
      )
  );


  overlay.classList.remove(
    "show"
  );


  render();

  updateTurn();

}


/* ================================================
   MODE
================================================ */

function setMode(
  newMode
){

  mode =
    newMode;


  document
    .getElementById("cpuMode")
    .classList.toggle(
      "active",
      mode === "cpu"
    );


  document
    .getElementById("friendMode")
    .classList.toggle(
      "active",
      mode === "friend"
    );


  document
    .getElementById("difficulty")
    .style.display =
      mode === "cpu"
        ? "flex"
        : "none";


  updateLabels();

  newRound();

}


/* ================================================
   DIFFICULTY
================================================ */

function setDifficulty(
  level
){

  difficulty =
    level;


  document
    .querySelectorAll(".diff")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  document
    .getElementById(level)
    .classList.add(
      "active"
    );


  newRound();

}


/* ================================================
   LABELS
================================================ */

function updateLabels(){

  const playerLabel =
    document.getElementById(
      "playerLabel"
    );

  const computerLabel =
    document.getElementById(
      "computerLabel"
    );


  if(
    mode === "friend"
  ){

    playerLabel.textContent =
      "PLAYER 1 ❌";


    computerLabel.textContent =
      "PLAYER 2 ⭕";

  }

  else{

    playerLabel.textContent =
      "YOU ❌";


    computerLabel.textContent =
      "CPU ⭕";

  }

}


/* ================================================
   RESULT POPUP
================================================ */

function showResult(
  symbol
){

  overlay.classList.add(
    "show"
  );


  if(
    mode === "friend"
  ){

    if(symbol === "X"){

      popupIcon.textContent =
        "🏆";

      popupTitle.textContent =
        "Player 1 Wins!";

      popupText.textContent =
        "Nice game! ❌";

    }else{

      popupIcon.textContent =
        "🏆";

      popupTitle.textContent =
        "Player 2 Wins!";

      popupText.textContent =
        "Nice game! ⭕";

    }

  }

  else{

    if(symbol === "X"){

      popupIcon.textContent =
        "🏆";

      popupTitle.textContent =
        "You Win!";

      popupText.textContent =
        "You outplayed the computer. 🔥";

    }else{

      popupIcon.textContent =
        "🤖";

      popupTitle.textContent =
        "Computer Wins";

      popupText.textContent =
        "The CPU got you this round.";

    }

  }

}


/* =======================
