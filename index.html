<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELEDIT GAME - Firebase Test</title>
</head>

<body style="font-family:Arial;padding:30px">

  <h1>CELEDIT GAME</h1>

  <input id="email" type="email" placeholder="Email"
    style="display:block;margin:10px 0;padding:12px;width:250px">

  <input id="password" type="password" placeholder="Password"
    style="display:block;margin:10px 0;padding:12px;width:250px">

  <button id="create"
    style="padding:12px 20px">
    Create Account
  </button>

  <p id="message"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyAntwXZaQ6Lrk_Dbn4uPJt9fMoKoETjOjM",

  authDomain: "celedit-game.firebaseapp.com",

  projectId: "celedit-game",

  storageBucket: "celedit-game.firebasestorage.app",

  messagingSenderId: "430066189305",

  appId: "1:430066189305:web:89953ce99876c97568f328"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


document.getElementById("create").onclick = async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.textContent =
      "Enter an email and password.";

    return;

  }


  message.textContent =
    "Creating account...";


  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    message.textContent =
      "✅ Account created: " +
      result.user.email;

  }

  catch(error) {

    console.error(error);

    message.textContent =
      "❌ " +
      error.code +
      " — " +
      error.message;

  }

};

</script>

</body>
</html>
