<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Seven Coins</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .message {
      display: none;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: #111;
      color: white;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .secondary {
      background: #eee;
      color: #111;
    }

    .danger {
      background: #c62828;
    }

    .text-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 10px;
      color: #555;
      cursor: pointer;
    }

    .welcome {
      font-size: 15px;
      color: #666;
      margin-bottom: 18px;
    }

    .balance-card {
      background: #111;
      color: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
    }

    .balance-label {
      font-size: 13px;
      opacity: .7;
    }

    .balance {
      font-size: 38px;
      font-weight: 800;
      margin-top: 7px;
    }

    .section-title {
      font-size: 20px;
      margin: 25px 0 12px;
    }

    .menu {
      display: grid;
      gap: 10px;
    }

    .menu button {
      width: 100%;
      text-align: left;
      border: 1px solid #ddd;
      background: white;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
    }

    .menu-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .menu-description {
      color: #777;
      font-size: 13px;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      border-top: 1px solid #ddd;
      margin-top: 28px;
      padding-top: 12px;
    }

    .bottom-nav button {
      border: 0;
      background: transparent;
      padding: 9px 2px;
      cursor: pointer;
      font-size: 12px;
    }

    .profile-card {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .profile-card strong {
      display: block;
      margin-bottom: 6px;
    }

    .profile-card p {
      color: #777;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">🪙 Seven Coins</div>


  <!-- LOGIN -->

  <section id="loginScreen" class="screen active">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your Seven Coins account.
    </p>

    <div id="loginMessage" class="message"></div>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="btn" onclick="login()">
      Login
    </button>

    <button class="text-btn" onclick="showSignup()">
      Don't have an account? Create Account
    </button>

  </section>


  <!-- CREATE ACCOUNT -->

  <section id="signupScreen" class="screen">

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your Seven Coins account.
    </p>

    <div id="signupMessage" class="message"></div>

    <input
      id="signupUsername"
      type="text"
      placeholder="Username"
      maxlength="30"
    >

    <input
      id="signupEmail"
      type="email"
      placeholder="Email address"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
    >

    <input
      id="signupConfirm"
      type="password"
      placeholder="Confirm password"
    >

    <button class="btn" onclick="createAccount()">
      Create Account
    </button>

    <button class="text-btn" onclick="showLogin()">
      Already have an account? Login
    </button>

  </section>


  <!-- HOME -->

  <section id="homeScreen" class="screen">

    <div class="welcome">
      Welcome, <strong id="homeUsername">User</strong> 👋
    </div>

    <div class="balance-card">

      <div class="balance-label">
        Your Balance
      </div>

      <div class="balance">
        0 🪙
      </div>

    </div>


    <h2 class="section-title">
      Daily Tasks
    </h2>

    <div class="menu">

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-tasks.html')">
        <div class="menu-title">🎯 Daily Tasks</div>
        <div class="menu-description">
          Complete available tasks.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-poll.html')">
        <div class="menu-title">📊 Daily Poll</div>
        <div class="menu-description">
          Vote in today's poll.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/referral.html')">
        <div class="menu-title">👥 Referral</div>
        <div class="menu-description">
          Invite friends and learn about referrals.
        </div>
      </button>

    </div>


    <h2 class="section-title">
      Account
    </h2>

    <div class="menu">

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/transactions-history.html')">
        <div class="menu-title">💰 Transactions</div>
        <div class="menu-description">
          View transaction history.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/withdraw.html')">
        <div class="menu-title">💸 Withdrawal</div>
        <div class="menu-description">
          Withdrawals are currently unavailable.
        </div>
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/advertisement.html')">
        <div class="menu-title">📢 Advertise</div>
        <div class="menu-description">
          Promote your product.
        </div>
      </button>

    </div>


    <div class="bottom-nav">

      <button onclick="showHome()">
        🏠<br>Home
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/daily-tasks.html')">
        🎯<br>Tasks
      </button>

      <button onclick="openPage('https://nigeriasurveys.blogspot.com/p/referral.html')">
        👥<br>Referral
      </button>

      <button onclick="showProfile()">
        👤<br>Profile
      </button>

    </div>

  </section>


  <!-- PROFILE -->

  <section id="profileScreen" class="screen">

    <h1>Profile</h1>

    <p class="subtitle">
      Your Seven Coins account.
    </p>

    <div class="profile-card">
      <strong>Username</strong>
      <p id="profileUsername">—</p>
    </div>

    <div class="profile-card">
      <strong>Email</strong>
      <p id="profileEmail">—</p>
    </div>

    <button class="btn secondary" onclick="showHome()">
      ← Back Home
    </button>

    <button class="btn danger" onclick="logout()">
      Logout
    </button>

  </section>

</div>


<script>

  /*
   * ==========================================
   * SEVEN COINS PROTOTYPE AUTHENTICATION
   * ==========================================
   *
   * NO FIREBASE
   * NO SUPABASE
   * NO API KEY
   *
   * This is ONLY a prototype.
   */


  const ACCOUNT_KEY = "sevenCoinsAccount";

  const SESSION_KEY = "sevenCoinsLoggedIn";


  /* =========================
     SCREEN CONTROL
  ========================= */

  function showScreen(id) {

    document
      .querySelectorAll(".screen")
      .forEach(screen => {
        screen.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

  }


  function showLogin() {

    clearMessages();

    showScreen("loginScreen");

  }


  function showSignup() {

    clearMessages();

    showScreen("signupScreen");

  }


  function showHome() {

    const account = getAccount();

    if (!account) {

      showLogin();

      return;

    }

    document
      .getElementById("homeUsername")
      .textContent = account.username;

    showScreen("homeScreen");

  }


  function showProfile() {

    const account = getAccount();

    if (!account) {

      showLogin();

      return;

    }

    document
      .getElementById("profileUsername")
      .textContent = account.username;

    document
      .getElementById("profileEmail")
      .textContent = account.email;

    showScreen("profileScreen");

  }


  /* =========================
     CREATE ACCOUNT
  ========================= */

  function createAccount() {

    const username =
      document
        .getElementById("signupUsername")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("signupPassword")
        .value;

    const confirm =
      document
        .getElementById("signupConfirm")
        .value;


    if (!username) {

      showSignupMessage(
        "Please enter a username."
      );

      return;

    }


    if (!email || !email.includes("@")) {

      showSignupMessage(
        "Please enter a valid email address."
      );

      return;

    }


    if (password.length < 6) {

      showSignupMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    if (password !== confirm) {

      showSignupMessage(
        "Passwords do not match."
      );

      return;

    }


    const existingAccount =
      getAccount();


    if (existingAccount) {

      showSignupMessage(
        "An account already exists in this browser."
      );

      return;

    }


    const account = {

      username: username,

      email: email,

      /*
       * Prototype only.
       * Real applications should NEVER
       * store passwords like this.
       */

      password: password,

      balance: 0,

      createdAt:
        new Date().toISOString()

    };


    localStorage.setItem(
      ACCOUNT_KEY,
      JSON.stringify(account)
    );


    localStorage.setItem(
      SESSION_KEY,
      "true"
    );


    showHome();

  }


  /* =========================
     LOGIN
  ========================= */

  function login() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    const account =
      getAccount();


    if (!account) {

      showLoginMessage(
        "No account found. Please create an account first."
      );

      return;

    }


    if (
      email !== account.email ||
      password !== account.password
    ) {

      showLoginMessage(
        "Incorrect email or password."
      );

      return;

    }


    localStorage.setItem(
      SESSION_KEY,
      "true"
    );


    showHome();

  }


  /* =========================
     LOGOUT
  ========================= */

  function logout() {

    localStorage.removeItem(
      SESSION_KEY
    );

    document
      .getElementById("loginEmail")
      .value = "";

    document
      .getElementById("loginPassword")
      .value = "";

    showLogin();

  }


  /* =========================
     GET ACCOUNT
  ========================= */

  function getAccount() {

    const data =
      localStorage.getItem(
        ACCOUNT_KEY
      );


    if (!data) {

      return null;

    }


    try {

      return JSON.parse(data);

    } catch {

      return null;

    }

  }


  /* =========================
     CHECK SESSION
  ========================= */

  function checkSession() {

    const loggedIn =
      localStorage.getItem(
        SESSION_KEY
      );


    const account =
      getAccount();


    if (loggedIn === "true" && account) {

      showHome();

    } else {

      showLogin();

    }

  }


  /* =========================
     BLOGGER PAGES
  ========================= */

  function openPage(url) {

    window.location.href = url;

  }


  /* =========================
     MESSAGES
  ========================= */

  function showLoginMessage(message) {

    const element =
      document.getElementById(
        "loginMessage"
      );

    element.textContent = message;

    element.classList.add("show");

  }


  function showSignupMessage(message) {

    const element =
      document.getElementById(
        "signupMessage"
      );

    element.textContent = message;

    element.classList.add("show");

  }


  function clearMessages() {

    document
      .getElementById("loginMessage")
      .classList.remove("show");

    document
      .getElementById("signupMessage")
      .classList.remove("show");

  }


  /* =========================
     START APP
  ========================= */

  checkSession();

</script>

</body>
</html>
