<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Celedit Tic Tac Toe</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:linear-gradient(145deg,#101827,#05080d);
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:480px;
  padding:18px;
  text-align:center;
}

h1{
  font-size:27px;
  margin-bottom:6px;
}

.subtitle{
  color:#8996a8;
  font-size:13px;
  margin-bottom:20px;
}

/* SYMBOL PICKER */

.choose{
  background:#121c29;
  border:1px solid #263548;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.chooseTitle{
  font-weight:900;
  margin-bottom:12px;
}

.symbols{
  display:flex;
  gap:10px;
}

.symbolBtn{
  flex:1;
  height:65px;
  border:2px solid #2a394c;
  border-radius:15px;
  background:#1a2533;
  color:white;
  font-size:27px;
  font-weight:900;
  cursor:pointer;
}

.symbolBtn.selected{
  border-color:#f1c40f;
  background:#293548;
  box-shadow:0 0 0 2px rgba(241,196,15,.15);
}

.symbolBtn:active{
  transform:scale(.95);
}

/* SCORE */

.score{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.scoreBox{
  background:#121c29;
  border-radius:13px;
  padding:10px 4px;
}

.scoreBox strong{
  display:block;
  font-size:22px;
}

.scoreBox span{
  color:#7f8da0;
  font-size:10px;
}

/* TURN */

.turn{
  min-height:24px;
  margin-bottom:12px;
  font-weight:900;
}

/* BOARD */

.board{
  width:min(92vw,390px);
  aspect-ratio:1;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;

  background:#080d14;
  padding:8px;
  border-radius:24px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.55);
}

.cell{
  border:0;
  border-radius:17px;
  background:#1a2635;

  color:white;
  font-size:64px;
  font-weight:900;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.12s;
}

.cell:active{
  transform:scale(.93);
}

.cell.x{
  color:#48a5ff;
}

.cell.o{
  color:#ff6078;
}

.cell.win{
  animation:pulse .5s infinite alternate;
}

@keyframes pulse{
  to{
    transform:scale(1.07);
    background:#28384b;
  }
}

/* CONTROLS */

.controls{
  margin-top:15px;
  display:flex;
  gap:8px;
}

.control{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px 8px;
  background:#1a2635;
  color:white;
  font-weight:900;
  cursor:pointer;
}

.control.primary{
  background:#f1c40f;
  color:#111;
}

.difficulty{
  margin-top:10px;
  display:flex;
  gap:7px;
}

.diff{
  flex:1;
  border:1px solid #2a394c;
  border-radius:10px;
  padding:9px 4px;
  background:#111a25;
  color:#8491a2;
  font-weight:bold;
  font-size:11px;
}

.diff.active{
  color:white;
  background:#263548;
  border-color:#62758c;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.84);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;
  z-index:20;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:350px;
  background:#16212e;
  border:1px solid #2c3b4e;
  border-radius:25px;
  padding:28px 22px;
  text-align:center;
}

.popupIcon{
  font-size:58px;
}

.popup h2{
  margin:8px 0;
  font-size:27px;
}

.popup p{
  color:#9ba8b8;
  line-height:1.5;
}

.popup button{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#f1c40f;
  color:#111;
  font-weight:900;
}

@media(max-width:380px){

  .cell{
    font-size:52px;
  }

  .board{
    gap:6px;
    padding:6px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>❌⭕ Celedit Tic Tac Toe</h1>

  <div class="subtitle">
    Choose your side and challenge the computer.
  </div>


  <!-- SYMBOL CHOICE -->

  <div class="choose">

    <div class="chooseTitle">
      Choose your symbol
    </div>

    <div class="symbols">

      <button
        class="symbolBtn selected"
        id="chooseX"
        onclick="chooseSymbol('X')">
        ❌
      </button>

      <button
        class="symbolBtn"
        id="chooseO"
        onclick="chooseSymbol('O')">
        ⭕
      </button>

    </div>

  </div>


  <!-- SCORE -->

  <div class="score">

    <div class="scoreBox">
      <strong id="playerScore">0</strong>
      <span>YOU</span>
    </div>

    <div class="scoreBox">
      <strong id="drawScore">0</strong>
      <span>DRAWS</span>
    </div>

    <div class="scoreBox">
      <strong id="cpuScore">0</strong>
      <span>COMPUTER</span>
    </div>

  </div>


  <div
    class="turn"
    id="turn">
    Your turn ❌
  </div>


  <!-- BOARD -->

  <div
    class="board"
    id="board">

    <button class="cell" data-i="0"></button>
    <button class="cell" data-i="1"></button>
    <button class="cell" data-i="2"></button>

    <button class="cell" data-i="3"></button>
    <button class="cell" data-i="4"></button>
    <button class="cell" data-i="5"></button>

    <button class="cell" data-i="6"></button>
    <button class="cell" data-i="7"></button>
    <button class="cell" data-i="8"></button>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="control primary"
      onclick="newGame()">
      🔄 New Game
    </button>

    <button
      class="control"
      onclick="resetScore()">
      Reset Score
    </button>

  </div>


  <div
    class="difficulty">

    <button
      class="diff active"
      id="easy"
      onclick="setDifficulty('easy')">
      EASY
    </button>

    <button
      class="diff"
      id="medium"
      onclick="setDifficulty('medium')">
      MEDIUM
    </button>

    <button
      class="diff"
      id="hard"
      onclick="setDifficulty('hard')">
      HARD
    </button>

  </div>

</div>


<!-- RESULT -->

<div
  class="overlay"
  id="overlay">

  <div class="popup">

    <div
      class="popupIcon"
      id="popupIcon">
      🏆
    </div>

    <h2 id="popupTitle">
      You Win!
    </h2>

    <p id="popupText">
      Great game!
    </p>

    <button onclick="newGame()">
      Play Again
    </button>

  </div>

</div>


<script>

/* =========================================
   GAME STATE
========================================= */

let board = [
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  ""
];

let playerSymbol = "X";

let computerSymbol = "O";

let turn = "player";

let gameActive = true;

let difficulty = "easy";


let scores = {

  player:
    Number(
      localStorage.getItem("celedit_ttt_player")
    ) || 0,

  computer:
    Number(
      localStorage.getItem("celedit_ttt_cpu")
    ) || 0,

  draws:
    Number(
      localStorage.getItem("celedit_ttt_draws")
    ) || 0

};


/* =========================================
   ELEMENTS
========================================= */

const cells =
  document.querySelectorAll(".cell");

const turnText =
  document.getElementById("turn");

const overlay =
  document.getElementById("overlay");


/* =========================================
   WINNING LINES
========================================= */

const winningLines = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];


/* =========================================
   CLICK BOARD
========================================= */

cells.forEach(cell => {

  cell.addEventListener(
    "click",
    () => {

      const index =
        Number(
          cell.dataset.i
        );

      playerMove(index);

    }
  );

});


/* =========================================
   CHOOSE X OR O
========================================= */

function chooseSymbol(symbol){

  playerSymbol =
    symbol;


  computerSymbol =
    symbol === "X"
      ? "O"
      : "X";


  document
    .getElementById("chooseX")
    .classList.toggle(
      "selected",
      symbol === "X"
    );


  document
    .getElementById("chooseO")
    .classList.toggle(
      "selected",
      symbol === "O"
    );


  newGame();

}


/* =========================================
   NEW GAME
========================================= */

function newGame(){

  board = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];


  gameActive =
    true;


  turn =
    "player";


  cells.forEach(
    cell => {

      cell.textContent =
        "";

      cell.className =
        "cell";

    }
  );


  /*
    If player chooses O,
    computer starts.
  */

  if(
    playerSymbol === "O"
  ){

    turn =
      "computer";


    turnText.textContent =
      "Computer starts ❌";


    setTimeout(
      computerMove,
      500
    );

  }

  else{

    turnText.textContent =
      "Your turn ❌";

  }

}


/* =========================================
   PLAYER MOVE
========================================= */

function playerMove(index){

  if(
    !gameActive ||
    turn !== "player" ||
    board[index] !== ""
  )
    return;


  board[index] =
    playerSymbol;


  render();


  if(
    checkResult()
  )
    return;


  turn =
    "computer";


  turnText.textContent =
    "Computer is thinking... 🤖";


  setTimeout(
    computerMove,
    400
  );

}


/* =========================================
   COMPUTER MOVE
========================================= */

function computerMove(){

  if(
    !gameActive
  )
    return;


  let move;


  if(
    difficulty === "easy"
  ){

    move =
      randomMove();

  }

  else if(
    difficulty === "medium"
  ){

    move =
      Math.random() < .6
        ? smartMove()
        : randomMove();

  }

  else{

    move =
      minimaxMove();

  }


  if(move === -1)
    return;


  board[move] =
    computerSymbol;


  render();


  if(
    checkResult()
  )
    return;


  turn =
    "player";


  turnText.textContent =
    `Your turn ${playerSymbol === "X" ? "❌" : "⭕"}`;

}


/* =========================================
   RANDOM MOVE
========================================= */

function randomMove(){

  const empty =
    board
      .map(
        (value,index) =>
          value === ""
            ? index
            : -1
      )
      .filter(
        index =>
          index !== -1
      );


  if(
    empty.length === 0
  )
    return -1;


  return empty[
    Math.floor(
      Math.random() *
      empty.length
    )
  ];

}


/* =========================================
   SMART MOVE
========================================= */

function smartMove(){

  /*
    WIN
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      computerSymbol;


    if(
      isWinner(
        computerSymbol
      )
    ){

      board[i] =
        "";

      return i;

    }


    board[i] =
      "";

  }


  /*
    BLOCK PLAYER
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      playerSymbol;


    if(
      isWinner(
        playerSymbol
      )
    ){

      board[i] =
        "";

      return i;

    }


    board[i] =
      "";

  }


  /*
    CENTER
  */

  if(
    board[4] === ""
  )
    return 4;


  /*
    CORNERS
  */

  const corners =
    [0,2,6,8]
      .filter(
        i =>
          board[i] === ""
      );


  if(
    corners.length
  ){

    return corners[
      Math.floor(
        Math.random() *
        corners.length
      )
    ];

  }


  return randomMove();

}


/* =========================================
   PERFECT AI
========================================= */

function minimaxMove(){

  let bestScore =
    -Infinity;

  let bestIndex =
    -1;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      computerSymbol;


    const score =
      minimax(
        false
      );


    board[i] =
      "";


    if(
      score > bestScore
    ){

      bestScore =
        score;

      bestIndex =
        i;

    }

  }


  return bestIndex;

}


function minimax(
  maximizing
){

  if(
    isWinner(
      computerSymbol
    )
  )
    return 10;


  if(
    isWinner(
      playerSymbol
    )
  )
    return -10;


  if(
    board.every(
      cell =>
        cell !== ""
    )
  )
    return 0;


  if(maximizing){

    let best =
      -Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(
        board[i] !== ""
      )
        continue;


      board[i] =
        computerSymbol;


      best =
        Math.max(
          best,
          minimax(false)
        );


      board[i] =
        "";

    }


    return best;

  }


  let best =
    Infinity;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i] !== ""
    )
      continue;


    board[i] =
      playerSymbol;


    best =
      Math.min(
        best,
        minimax(true)
      );


    board[i] =
      "";

  }


  return best;

}


/* =========================================
   CHECK WINNER
========================================= */

function isWinner(symbol){

  return winningLines.some(
    line =>
      line.every(
        index =>
          board[index] === symbol
      )
  );

}


/* =========================================
   CHECK RESULT
========================================= */

function checkResult(){

  for(
    const line of winningLines
  ){

    if(
      board[line[0]] !== "" &&
      board[line[0]] === board[line[1]] &&
      board[line[1]] === board[line[2]]
    ){

      gameActive =
        false;


      line.forEach(
        index =>
          cells[index]
            .classList.add(
              "win"
            )
      );


      const winner =
        board[line[0]];


      if(
        winner === playerSymbol
      ){

        scores.player++;

        showResult(
          "🏆",
          "You Win!",
          `You won as ${playerSymbol === "X" ? "❌" : "⭕"}!`
        );

      }

      else{

        scores.computer++;

        showResult(
          "🤖",
          "Computer Wins",
          "The computer got this round."
        );

      }


      saveScores();

      updateScores();


      return true;

    }

  }


  /*
    DRAW
  */

  if(
    board.every(
      cell =>
        cell !== ""
    )
  ){

    gameActive =
      false;


    scores.draws++;


    saveScores();

    updateScores();


    showResult(
      "🤝",
      "Draw!",
      "Nobody won this round."
    );


    return true;

  }


  return false;

}


/* =========================================
   RENDER
========================================= */

function render(){

  cells.forEach(
    (cell,index) => {

      cell.textContent =
        board[index];


      cell.classList.remove(
        "x",
        "o"
      );


      if(
        board[index] === "X"
      ){

        cell.classList.add(
          "x"
        );

      }


      if(
        board[index] === "O"
      ){

        cell.classList.add(
          "o"
        );

      }

    }
  );

}


/* =========================================
   RESULT POPUP
========================================= */

function showResult(
  icon,
  title,
  text
){

  document.getElementById(
    "popupIcon"
  ).textContent =
    icon;


  document.getElementById(
    "popupTitle"
  ).textContent =
    title;


  document.getElementById(
    "popupText"
  ).textContent =
    text;


  overlay.classList.add(
    "show"
  );

}


/* =========================================
   DIFFICULTY
========================================= */

function setDifficulty(
  level
){

  difficulty =
    level;


  document
    .querySelectorAll(".diff")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  document
    .getElementById(level)
    .classList.add(
      "active"
    );


  newGame();

}


/* =========================================
   SCORE
========================================= */

function updateScores(){

  document.getElementById(
    "playerScore"
  ).textContent =
    scores.player;


  document.getElementById(
    "cpuScore"
  ).textContent =
    scores.computer;


  document.getElementById(
    "drawScore"
  ).textContent =
    scores.draws;

}


function saveScores(){

  localStorage.setItem(
    "celedit_ttt_player",
    scores.player
  );


  localStorage.setItem(
    "celedit_ttt_cpu",
    scores.computer
  );


  localStorage.setItem(
    "celedit_ttt_draws",
    scores.draws
  );

}


function resetScore(){

  scores = {

    player:0,
    computer:0,
    draws:0

  };


  saveScores();

  updateScores();

  newGame();

}


/* =========================================
   START
========================================= */

updateScores();

newGame();

</script>

</body>
  </html>
