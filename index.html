<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celedit Ludo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#10131b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:620px;
    padding:12px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.mode{
    background:#202633;
    border-radius:20px;
    padding:8px 12px;
    font-size:12px;
    font-weight:bold;
}

/* TURN */

.turn{
    text-align:center;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

/* BOARD */

.board{
    position:relative;
    width:min(96vw,580px);
    aspect-ratio:1;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);

    background:#fafafa;

    border:5px solid #171b23;
    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.45);
}

/* CELLS */

.cell{
    position:relative;
    border:1px solid #c9c9c9;
    background:#fff;
}

/* BASES */

.base{
    position:absolute;
    width:40%;
    height:40%;

    padding:8%;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:9%;

    border:3px solid rgba(0,0,0,.18);
}

.redBase{
    left:0;
    top:0;
    background:#ed4747;
}

.greenBase{
    right:0;
    top:0;
    background:#35b96a;
}

.yellowBase{
    right:0;
    bottom:0;
    background:#f1c83a;
}

.blueBase{
    left:0;
    bottom:0;
    background:#3e8fe5;
}

.homeSpot{
    background:white;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.16);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.18);
}

/* CENTER */

.center{
    position:absolute;

    left:40%;
    top:40%;

    width:20%;
    height:20%;

    background:
        conic-gradient(
            #35b96a 0deg 90deg,
            #f1c83a 90deg 180deg,
            #3e8fe5 180deg 270deg,
            #ed4747 270deg 360deg
        );

    clip-path:polygon(
        0 0,
        100% 0,
        100% 100%,
        0 100%
    );

    z-index:2;
}

.center::after{
    content:"";
    position:absolute;

    left:20%;
    top:20%;

    width:60%;
    height:60%;

    background:white;

    clip-path:polygon(
        50% 0,
        100% 50%,
        50% 100%,
        0 50%
    );
}

/* PATH CELLS */

.pathCell{
    background:#fff;
}

.redLane{
    background:#f6a5a5 !important;
}

.greenLane{
    background:#a7e4bd !important;
}

.yellowLane{
    background:#f7e79d !important;
}

.blueLane{
    background:#a9cff4 !important;
}

/* START CELLS */

.start-red{
    background:#ed4747 !important;
}

.start-green{
    background:#35b96a !important;
}

.start-yellow{
    background:#f1c83a !important;
}

.start-blue{
    background:#3e8fe5 !important;
}

/* SAFE */

.safe::before{
    content:"★";
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    color:#777;
}

/* TOKENS */

.token{
    position:absolute;

    width:5.5%;
    aspect-ratio:1;

    transform:translate(-50%,-50%);

    border-radius:50%;

    z-index:20;

    border:2px solid rgba(0,0,0,.3);

    box-shadow:
        inset 3px 3px 4px rgba(255,255,255,.45),
        inset -4px -4px 5px rgba(0,0,0,.25),
        0 3px 5px rgba(0,0,0,.35);

    transition:
        left .12s linear,
        top .12s linear,
        transform .15s;
}

.token.blue{
    background:#126bc4;
}

.token.red{
    background:#c92828;
}

.token.movable{
    animation:pulse .65s infinite alternate;
    cursor:pointer;
}

@keyframes pulse{
    from{
        transform:translate(-50%,-50%) scale(1);
    }
    to{
        transform:translate(-50%,-50%) scale(1.18);
    }
}

/* DICE */

.controls{
    margin-top:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.dice{
    width:68px;
    height:68px;

    background:white;
    color:#111;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:39px;

    box-shadow:0 7px 16px rgba(0,0,0,.3);
}

.rollBtn{
    border:0;

    background:#fff;
    color:#111;

    padding:14px 22px;

    border-radius:13px;

    font-weight:900;
    font-size:14px;
}

.rollBtn:disabled{
    opacity:.35;
}

.bottom{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.resetBtn{
    border:0;
    background:#202633;
    color:#fff;

    padding:10px 18px;

    border-radius:12px;

    font-weight:bold;
}

.help{
    text-align:center;
    margin-top:9px;

    color:#8993a5;
    font-size:11px;
    line-height:1.5;
}

/* WIN SCREEN */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.82);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:100;
}

.overlay.show{
    display:flex;
}

.popup{
    width:100%;
    max-width:350px;

    background:#1b222e;

    border-radius:23px;

    padding:28px;

    text-align:center;
}

.popupEmoji{
    font-size:58px;
}

.popup h2{
    margin:8px 0;
}

.popup p{
    color:#aab3c2;
    line-height:1.5;
    font-size:14px;
}

.playAgain{
    width:100%;

    margin-top:16px;

    border:0;

    background:white;
    color:#111;

    padding:13px;

    border-radius:12px;

    font-weight:bold;
}

/* MOBILE */

@media(max-width:420px){

    .app{
        padding:8px;
    }

    .logo{
        font-size:20px;
    }

    .board{
        border-width:4px;
    }

    .token{
        width:6.5%;
    }

    .dice{
        width:60px;
        height:60px;
        font-size:34px;
    }

}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🎲 Celedit Ludo</div>
        <div class="mode">🔵 YOU VS 🔴 CPU</div>
    </div>

    <div class="turn" id="turnText">
        Your turn — Roll the dice
    </div>

    <div class="board" id="board">

        <!-- 15 x 15 board cells are generated by JavaScript -->

        <!-- BASES -->

        <div class="base redBase">
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
        </div>

        <div class="base greenBase">
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
        </div>

        <div class="base yellowBase">
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
        </div>

        <div class="base blueBase">
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
            <div class="homeSpot"></div>
        </div>

        <div class="center"></div>

    </div>

    <div class="controls">

        <div class="dice" id="dice">
            ⚀
        </div>

        <button
            class="rollBtn"
            id="rollBtn"
            onclick="rollDice()">
            🎲 ROLL
        </button>

    </div>

    <div class="bottom">

        <button
            class="resetBtn"
            onclick="newGame()">
            🔄 New Game
        </button>

    </div>

    <div class="help">
        Roll 6 to bring a token out of base.<br>
        Tap a highlighted token to move it.
    </div>

</div>


<div class="overlay" id="overlay">

    <div class="popup">

        <div class="popupEmoji" id="popupEmoji">
            🏆
        </div>

        <h2 id="popupTitle">
            You Win!
        </h2>

        <p id="popupText"></p>

        <button
            class="playAgain"
            onclick="newGame()">
            Play Again
        </button>

    </div>

</div>


<script>

/* =====================================================
   CELEDIT LUDO
   PLAYER: BLUE
   COMPUTER: RED
===================================================== */


/* -----------------------------------------------------
   BOARD
----------------------------------------------------- */

const board =
    document.getElementById("board");

const turnText =
    document.getElementById("turnText");

const diceElement =
    document.getElementById("dice");

const rollBtn =
    document.getElementById("rollBtn");


/* -----------------------------------------------------
   15 x 15 GRID
----------------------------------------------------- */

const cells = [];

for(let row=0; row<15; row++){

    for(let col=0; col<15; col++){

        const cell =
            document.createElement("div");

        cell.className="cell";

        cell.dataset.row=row;
        cell.dataset.col=col;

        /*
          Only the playable cross is shown.
        */

        if(
            row>=6 &&
            row<=8 ||
            col>=6 &&
            col<=8
        ){

            cell.classList.add("pathCell");

        }else{

            cell.style.background="transparent";
            cell.style.border="0";

        }

        board.insertBefore(
            cell,
            board.querySelector(".base")
        );

        cells.push(cell);

    }

}


/* -----------------------------------------------------
   REAL LUDO-STYLE 52 PATH
----------------------------------------------------- */

const path = [

    /* Top */

    [6,1],
    [6,2],
    [6,3],
    [6,4],
    [6,5],

    [5,6],
    [4,6],
    [3,6],
    [2,6],
    [1,6],

    [0,6],

    [0,7],

    [0,8],

    [1,8],
    [2,8],
    [3,8],
    [4,8],
    [5,8],

    [6,9],
    [6,10],
    [6,11],
    [6,12],
    [6,13],

    [6,14],

    [7,14],

    [8,14],

    [8,13],
    [8,12],
    [8,11],
    [8,10],
    [8,9],

    [9,8],
    [10,8],
    [11,8],
    [12,8],
    [13,8],

    [14,8],

    [14,7],

    [14,6],

    [13,6],
    [12,6],
    [11,6],
    [10,6],
    [9,6],

    [8,5],
    [8,4],
    [8,3],
    [8,2],
    [8,1],

    [8,0],

    [7,0],

    [6,0]

];


/*
  The path above contains 56 visual points
  around the cross. We use the first 52
  as the main track.
*/

const TRACK =
    path.slice(0,52);


/* -----------------------------------------------------
   COLOR START POSITIONS
----------------------------------------------------- */

const PLAYER_START = 39;

const CPU_START = 0;


/* -----------------------------------------------------
   HOME LANES
----------------------------------------------------- */

const playerLane = [
    [8,1],
    [8,2],
    [8,3],
    [8,4],
    [8,5],
    [7,6]
];

const cpuLane = [
    [1,6],
    [2,6],
    [3,6],
    [4,6],
    [5,6],
    [6,7]
];


/* -----------------------------------------------------
   SAFE POSITIONS
----------------------------------------------------- */

const safePositions = [
    0,
    8,
    13,
    21,
    26,
    34,
    39,
    47
];


/* -----------------------------------------------------
   TOKENS
----------------------------------------------------- */

let player =
    [-1,-1,-1,-1];

let cpu =
    [-1,-1,-1,-1];


/*
  Position meaning:

  -1 = in base

   0..51 = on main track

   52..57 = home lane

   58 = finished
*/


let currentTurn="player";

let diceValue=0;

let gameOver=false;

let rolling=false;


/* -----------------------------------------------------
   HOME POSITIONS
----------------------------------------------------- */

const playerHomes = [
    [11.5,72],
    [28.5,72],
    [11.5,88],
    [28.5,88]
];

const cpuHomes = [
    [11.5,12],
    [28.5,12],
    [11.5,28],
    [28.5,28]
];


/* -----------------------------------------------------
   CREATE START CELLS
----------------------------------------------------- */

function stylePath(){

    /*
      Clear previous path styling.
    */

    cells.forEach(
        c=>{
            c.classList.remove(
                "redLane",
                "greenLane",
                "yellowLane",
                "blueLane",
                "safe",
                "start-red",
                "start-blue"
            );
        }
    );


    /*
      Main track.
    */

    TRACK.forEach(
        (coord,index)=>{

            const row=coord[0];
            const col=coord[1];

            const cell=
                cells.find(
                    c =>
                    Number(c.dataset.row)===row &&
                    Number(c.dataset.col)===col
                );

            if(cell){

                cell.classList.add("pathCell");

                if(
                    safePositions.includes(index)
                ){
                    cell.classList.add("safe");
                }

            }

        }
    );


    /*
      Player start.
    */

    const pStart =
        TRACK[PLAYER_START];

    const pCell =
        cells.find(
            c =>
            Number(c.dataset.row)===pStart[0] &&
            Number(c.dataset.col)===pStart[1]
        );

    if(pCell)
        pCell.classList.add("start-blue");


    /*
      CPU start.
    */

    const cStart =
        TRACK[CPU_START];

    const cCell =
        cells.find(
            c =>
            Number(c.dataset.row)===cStart[0] &&
            Number(c.dataset.col)===cStart[1]
        );

    if(cCell)
        cCell.classList.add("start-red");


    /*
      Player home lane.
    */

    playerLane.forEach(
        coord=>{

            const cell=
                cells.find(
                    c =>
                    Number(c.dataset.row)===coord[0] &&
                    Number(c.dataset.col)===coord[1]
                );

            if(cell)
                cell.classList.add("blueLane");

        }
    );


    /*
      CPU home lane.
    */

    cpuLane.forEach(
        coord=>{

            const cell=
                cells.find(
                    c =>
                    Number(c.dataset.row)===coord[0] &&
                    Number(c.dataset.col)===coord[1]
                );

            if(cell)
                cell.classList.add("redLane");

        }
    );

}


/* -----------------------------------------------------
   POSITION TOKEN
----------------------------------------------------- */

function positionToken(
    token,
    position,
    isPlayer,
    index
){

    /*
      HOME
    */

    if(position===-1){

        const home =
            isPlayer
            ? playerHomes[index]
            : cpuHomes[index];

        token.style.left =
            home[0] + "%";

        token.style.top =
            home[1] + "%";

        return;

    }


    /*
      FINISHED
    */

    if(position>=58){

        /*
          Put finished tokens around
          their center side.
        */

        const home =
            isPlayer
            ? [45 + index*3, 52]
            : [45 + index*3, 48];

        token.style.left =
            home[0] + "%";

        token.style.top =
            home[1] + "%";

        return;

    }


    /*
      HOME LANE
    */

    if(position>=52){

        const laneIndex =
            position-52;

        const lane =
            isPlayer
            ? playerLane[laneIndex]
            : cpuLane[laneIndex];

        token.style.left =
            ((lane[1]+.5)/15*100) + "%";

        token.style.top =
            ((lane[0]+.5)/15*100) + "%";

        return;

    }


    /*
      MAIN TRACK
    */

    const start =
        isPlayer
        ? PLAYER_START
        : CPU_START;

    const global =
        (start + position) % TRACK.length;

    const coord =
        TRACK[global];

    token.style.left =
        ((coord[1]+.5)/15*100) + "%";

    token.style.top =
        ((coord[0]+.5)/15*100) + "%";

}


/* -----------------------------------------------------
   CREATE TOKENS
----------------------------------------------------- */

function renderTokens(){

    board
        .querySelectorAll(".token")
        .forEach(
            token=>token.remove()
        );


    player.forEach(
        (position,index)=>{

            createToken(
                position,
                true,
                index
            );

        }
    );


    cpu.forEach(
        (position,index)=>{

            createToken(
                position,
                false,
                index
            );

        }
    );

}


/* -----------------------------------------------------
   CREATE ONE TOKEN
----------------------------------------------------- */

function createToken(
    position,
    isPlayer,
    index
){

    const token =
        document.createElement("div");

    token.className =
        "token " +
        (isPlayer ? "blue" : "red");


    positionToken(
        token,
        position,
        isPlayer,
        index
    );


    /*
      Player can select movable token.
    */

    if(
        isPlayer &&
        currentTurn==="player" &&
        diceValue>0 &&
        canMove(
            position,
            diceValue
        )
    ){

        token.classList.add(
            "movable"
        );

        token.onclick =
            ()=>{
                movePlayer(index);
            };

    }


    board.appendChild(token);

}


/* -----------------------------------------------------
   CAN MOVE
----------------------------------------------------- */

function canMove(
    position,
    amount
){

    if(position===58)
        return false;


    /*
      Base token requires 6.
    */

    if(position===-1)
        return amount===6;


    /*
      Main track.
    */

    if(position<52){

        return true;

    }


    /*
      Home lane.
    */

    return position + amount <= 58;

}


/* -----------------------------------------------------
   ROLL DICE
----------------------------------------------------- */

function rollDice(){

    if(
        gameOver ||
        rolling ||
        currentTurn!=="player"
    )
        return;


    rolling=true;

    rollBtn.disabled=true;


    let count=0;


    const animation =
        setInterval(
            ()=>{

                const value =
                    Math.floor(
                        Math.random()*6
                    )+1;

                diceElement.textContent =
                    getDiceFace(value);

                count++;


                if(count>=10){

                    clearInterval(
                        animation
                    );

                    diceValue =
                        Math.floor(
                            Math.random()*6
                        )+1;


                    diceElement.textContent =
                        getDiceFace(
                            diceValue
                        );


                    rolling=false;

                    playerRolled();

                }

            },
            65
        );

}


/* -----------------------------------------------------
   DICE FACE
----------------------------------------------------- */

function getDiceFace(value){

    return [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ][value-1];

}


/* -----------------------------------------------------
   PLAYER ROLL RESULT
----------------------------------------------------- */

function playerRolled(){

    turnText.textContent =
        "You rolled " +
        diceValue +
        " 🎲";


    const movable =
        player.some(
            p =>
            canMove(
                p,
                diceValue
            )
        );


    if(!movable){

        turnText.textContent =
            "No legal move.";


        if(diceValue===6){

            setTimeout(
                ()=>{
                    diceValue=0;
